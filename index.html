<style>
[hidden]{display:none!important}
:root{
  --blue:#1F449C;--blue-d:#152f70;--blue-l:#e8eefb;--blue-xl:#f4f7fd;
  --yellow:#F8B518;--yellow-d:#d99a06;--yellow-l:#fff4d6;
  --ink:#16213a;--mut:#64708a;--line:#e3e8f2;--bg:#f2f5fb;
  --ok:#14803c;--okbg:#e7f6ed;--bad:#c0281c;--badbg:#fdeceb;
}
*{box-sizing:border-box}
html{font-family:Inter,"Noto Sans Bengali",system-ui,sans-serif}
html[lang=bn]{font-family:"Noto Sans Bengali",Inter,system-ui,sans-serif}
body{margin:0;color:var(--ink);font-size:15px;line-height:1.6;min-height:100vh;background:var(--bg);
  background-image:radial-gradient(900px 320px at 50% -120px,#d6e1f8,transparent)}
html[lang=bn] body{font-size:16px}
button,input,select,textarea{font-family:inherit}
.num,td,th,input[type=number],.stat b{font-variant-numeric:tabular-nums lining-nums}

/* ---------- Top bar ---------- */
.top{background:linear-gradient(115deg,var(--blue-d),var(--blue));color:#fff;position:relative}
.top:after{content:"";display:block;height:4px;background:linear-gradient(90deg,var(--yellow),#ffd566,var(--yellow))}
.top .in{max-width:1000px;margin:auto;padding:12px 18px;display:flex;align-items:center;gap:12px}
.brand{display:flex;align-items:center;gap:12px;margin-right:auto;min-width:0}
.brand b{display:block;font-size:18px;font-weight:700;line-height:1.25}
.brand span{font-size:12px;color:#ffd566;letter-spacing:1.2px;text-transform:uppercase;font-weight:600}
html[lang=bn] .brand span{letter-spacing:0;text-transform:none;font-size:13.5px}
.logo{width:54px;height:54px;border-radius:14px;background:#fff center/160% no-repeat;flex:none;
  box-shadow:0 0 0 3px rgba(255,255,255,.22),0 6px 14px rgba(0,0,0,.2);display:flex;align-items:center;justify-content:center;
  color:var(--blue);font-weight:800;font-size:18px}
.logo.ok{background-image:var(--logo);font-size:0}
.lang{display:flex;background:rgba(255,255,255,.14);border-radius:999px;padding:3px}
.lang button{border:0;background:transparent;color:#dbe5fa;padding:6px 14px;border-radius:999px;font-size:13px;cursor:pointer;font-weight:500}
.lang button.on{background:var(--yellow);color:var(--blue-d);font-weight:700}
.lockb{background:rgba(255,255,255,.14);border:0;color:#fff;padding:8px 14px;border-radius:999px;font-size:13px;cursor:pointer}
.lockb:hover{background:rgba(255,255,255,.24)}

/* ---------- Nav ---------- */
nav{background:rgba(255,255,255,.9);backdrop-filter:blur(10px);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:5}
nav .in{max-width:1000px;margin:auto;display:flex;gap:6px;overflow-x:auto;padding:10px 14px}
nav button{flex:none;border:0;background:transparent;padding:9px 16px;border-radius:999px;font-weight:600;font-size:14.5px;color:var(--mut);cursor:pointer;transition:.15s}
nav button:hover{background:var(--blue-l);color:var(--blue)}
nav button.on{background:var(--blue);color:#fff;box-shadow:0 6px 14px rgba(31,68,156,.3)}

main{max-width:1000px;margin:auto;padding:22px 16px 60px}
.card{background:#fff;border:1px solid var(--line);border-radius:18px;padding:24px;box-shadow:0 10px 30px rgba(21,47,112,.08)}
h2{font-size:14px;margin:30px 0 10px;color:var(--blue);text-transform:uppercase;letter-spacing:1px;font-weight:700}
html[lang=bn] h2{text-transform:none;letter-spacing:0;font-size:17px}
h3{font-size:14px;margin:0 0 4px;color:var(--blue);padding-bottom:9px;border-bottom:3px solid var(--yellow);text-transform:uppercase;letter-spacing:.9px;font-weight:700}
html[lang=bn] h3{text-transform:none;letter-spacing:0;font-size:17px}
label{display:block;font-size:13.5px;font-weight:600;color:var(--mut);margin:16px 0 6px}
input,select,textarea{width:100%;padding:12px 14px;border:1.5px solid var(--line);border-radius:12px;font-size:inherit;color:var(--ink);background:#fbfcfe;transition:.15s}
textarea{min-height:84px;resize:vertical}
input:focus,select:focus,textarea:focus{outline:0;border-color:var(--blue);background:#fff;box-shadow:0 0 0 4px rgba(31,68,156,.14)}
button:focus-visible{outline:2px solid var(--yellow);outline-offset:2px}
.btns{display:flex;gap:10px;margin-top:22px}
.btn{padding:13px 20px;border-radius:12px;border:1.5px solid var(--line);background:#fff;color:var(--ink);font-weight:600;font-size:inherit;cursor:pointer;transition:.15s}
.btn:hover{border-color:var(--blue);color:var(--blue)}
.btn.pri{flex:1;background:linear-gradient(135deg,var(--blue),var(--blue-d));border-color:var(--blue-d);color:#fff;box-shadow:0 8px 20px rgba(31,68,156,.28)}
.btn.pri:hover{color:#fff;filter:brightness(1.08)}
.btn.gold{background:linear-gradient(135deg,#ffd15a,var(--yellow));border-color:var(--yellow-d);color:var(--blue-d);font-weight:700;box-shadow:0 8px 20px rgba(248,181,24,.38)}
.btn.gold:hover{color:var(--blue-d);filter:brightness(1.04)}
.btn:disabled{opacity:.45;cursor:default;box-shadow:none}
#msg{margin-top:12px;min-height:24px;color:var(--ok);font-weight:600}
#msg.err,#lmsg{color:var(--bad)}

/* stats */
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin:20px 0 4px}
.stat{border:1px solid var(--line);border-radius:14px;padding:14px 16px;background:linear-gradient(180deg,#fff,var(--blue-xl));position:relative;overflow:hidden}
.stat:before{content:"";position:absolute;left:0;top:0;bottom:0;width:5px;background:var(--blue)}
.stat small{display:block;color:var(--mut);font-size:13px}
.stat b{display:block;font-size:26px;font-weight:700;margin-top:2px}
.stat.ok{background:var(--okbg)}.stat.ok:before{background:var(--ok)}.stat.ok b{color:var(--ok)}
.stat.bad{background:var(--badbg)}.stat.bad:before{background:var(--bad)}.stat.bad b{color:var(--bad)}
.cols{display:grid;grid-template-columns:1fr 1fr;gap:30px;margin-top:8px}
.sum{display:flex;justify-content:space-between;align-items:center;padding:12px 14px;margin-top:14px;border-radius:12px;background:var(--yellow-l);border:1px solid #f3d27a;font-weight:700;color:var(--blue-d)}
input.lk{background:#eef1f7;color:var(--mut);pointer-events:none}
.autohd{margin-top:18px;padding:8px 12px;border-radius:10px;background:var(--blue-l);color:var(--blue);font-size:13px;font-weight:600}
.dtog{display:block;margin-top:6px;background:none;border:0;color:var(--blue);font-size:13px;font-weight:600;cursor:pointer;text-decoration:underline;padding:0}

/* tables */
table{border-collapse:collapse;width:100%;font-size:14px}
th,td{padding:10px 12px;text-align:left;white-space:nowrap;border-bottom:1px solid var(--line)}
th{background:var(--blue);color:#fff;font-weight:600;font-size:13px}
tbody tr:nth-child(even) td{background:var(--blue-xl)}
.tbl{overflow-x:auto;background:#fff;border:1px solid var(--line);border-radius:14px;box-shadow:0 8px 24px rgba(21,47,112,.06)}
.empty{padding:22px;color:var(--mut);text-align:center}
table.notes{margin-top:10px}
table.notes td{padding:6px 8px}
table.notes input{padding:8px 10px;text-align:right}
table.notes td.r,table.notes th.r{text-align:right}
table.notes td:first-child{font-weight:700;color:var(--blue)}

/* login */
#lock{padding:18px;min-height:calc(100vh - 80px);display:flex;align-items:center;justify-content:center;
  background:radial-gradient(circle at 20% 10%,#2d58c0,var(--blue-d) 70%)}
#lock .card{width:100%;max-width:390px;padding:34px 28px;text-align:center;border-top:6px solid var(--yellow);border-radius:22px;box-shadow:0 30px 70px rgba(0,0,0,.4)}
#lock .logo{margin:0 auto 14px;width:92px;height:92px;border-radius:22px;box-shadow:0 0 0 1px var(--line),0 10px 24px rgba(21,47,112,.15);background-color:#fff;background-size:150%}
#lock h1{font-size:22px;margin:0 0 4px;color:var(--blue)}
#lock p{margin:0 0 6px;color:var(--mut)}
#lock input{text-align:center;letter-spacing:8px;font-size:20px}
.rem{display:flex;align-items:center;justify-content:center;gap:8px;margin:16px 0 0;font-weight:500;cursor:pointer}.rem input{width:auto}

/* report controls */
.ctl{background:#fff;border:1px solid var(--line);border-radius:18px;padding:16px 18px;display:flex;gap:12px;align-items:flex-end;flex-wrap:wrap;box-shadow:0 10px 30px rgba(21,47,112,.08)}
.ctl label{margin:0 0 5px}.dn{display:flex;gap:6px}.dn input{width:auto}.ctl .btn{padding:11px 16px}.ctl .btn.pri{flex:none}
#rmsg{color:var(--bad);font-size:14px;min-height:20px;margin:10px 2px 0}
.stage{overflow-x:auto;padding:14px 0 20px}
.holder{width:600px;margin:0 auto;border-radius:8px;box-shadow:0 24px 60px rgba(21,47,112,.3)}
.dlbar{max-width:600px;margin:0 auto;display:flex;gap:10px}.dlbar .btn{flex:1;padding:16px;font-size:16px}
@media(max-width:720px){.cols{grid-template-columns:1fr;gap:6px}.stats{grid-template-columns:1fr}.stat b{font-size:22px}.brand b{font-size:16px}}

/* ================= SQUARE REPORT 600x600 — OCEAN ================= */
#rep{width:600px;height:600px;position:relative;overflow:hidden;display:flex;flex-direction:column;background:#effaff;color:#1a2033;
  font:500 13px/1.3 "Noto Sans Bengali",Inter,sans-serif;font-variant-numeric:lining-nums}
#rep *{box-sizing:border-box}#rep p{margin:0}
#rep .hd{background:linear-gradient(110deg,#0ea5e9,#2563eb);color:#fff;padding:14px 22px;display:flex;align-items:center;gap:14px}
#rep .lg{width:50px;height:50px;border-radius:50%;background:#fff center/155% no-repeat;color:#1d4ed8;font-weight:800;font-size:17px;display:flex;align-items:center;justify-content:center;flex:none}
#rep .lg.ok{background-image:var(--logo);font-size:0}
#rep .nm{flex:1}#rep .nm b{display:block;font-size:20px;font-weight:800;line-height:1.2}#rep .nm span{font-size:13.5px;opacity:.9}
#rep .dd{text-align:right}#rep .dd b{display:block;font-size:14px;font-weight:700}#rep .dd span{display:block;font-size:11.5px;opacity:.85}
#rep .dd .wd{font-size:13px;font-weight:800;opacity:1;color:#fef08a}
#rep .st{margin:12px 22px 0;height:90px;padding:8px 14px 8px 16px;border-radius:14px;background:var(--sb);border-left:7px solid var(--sc);display:flex;align-items:center;justify-content:space-between;box-shadow:0 3px 10px rgba(0,0,0,.07)}
#rep .st.sh{--sc:#dc2626;--sb:#fff0f0}#rep .st.ov,#rep .st.ok{--sc:#16a34a;--sb:#ecfaf1}
#rep .st .fg{line-height:1.65;font-size:13.5px;min-width:0}#rep .st .lb{font-size:18px;font-weight:800;color:var(--sc);line-height:1.3}#rep .st .fg b{font-weight:800}
#rep .stamp{flex:none;width:132px;height:78px;border-radius:50%;border:4px double var(--sc);color:var(--sc);display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;transform:rotate(-8deg);line-height:1.2;background:rgba(255,255,255,.65)}
#rep .stamp span{font-size:12.5px;font-weight:800}#rep .stamp b{font-weight:800;white-space:nowrap}
#rep .cd{margin:10px 22px 0;display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
#rep .cd div{border-radius:14px;padding:8px 10px}#rep .cd small{display:block;font-size:12.5px;font-weight:600;opacity:.85;white-space:nowrap}
#rep .cd b{display:block;font-size:16px;font-weight:800;line-height:1.3;white-space:nowrap}
#rep .cd div:nth-child(1){background:#ccfbf1;color:#0f766e}#rep .cd div:nth-child(2){background:#e0e7ff;color:#3730a3}
#rep .cd div:nth-child(3){background:#ffe4e6;color:#be123c}#rep .cd div:nth-child(4){background:#fef08a;color:#713f12}
#rep .tb{flex:1;min-height:0;margin:10px 22px 0;display:grid;grid-template-columns:1fr 1fr;gap:14px}
#rep .box{background:#fff;border-radius:14px;overflow:hidden;box-shadow:0 3px 10px rgba(0,0,0,.07)}
#rep h4{margin:0;padding:6px 14px;font-size:14px;font-weight:800;background:#1d4ed8;color:#fff}
#rep .box p{display:flex;justify-content:space-between;gap:8px;padding:2.5px 14px;font-size:12.5px;border-bottom:1px solid #eef0f5}
#rep .box p b{font-weight:700}#rep .box .r b{color:#d62839}#rep .box .z{opacity:.38}
#rep .box .t{background:#dbeafe;font-weight:800}#rep .box .f span{white-space:normal;line-height:1.25}#rep .box .f{align-items:center}#rep .box .f{background:#1d4ed8;color:#fff;font-weight:800;border:0}
#rep .box .nn{display:block;padding:40px 14px;text-align:center;color:#5d6679;white-space:normal;line-height:1.7}
#rep footer{margin-top:auto;padding:8px 22px;display:flex;justify-content:space-between;font-size:11.5px;color:#5d6679;border-top:3px solid #1d4ed8}
#rep footer b{color:#1d4ed8}
</style>

async function dateTaken(sheet,date){
  try{
    const r=await call('exists',{sheet,date});
    if(r&&typeof r.exists==='boolean')return r.exists;
    if(sheet==='daily'){const q=await call('report',{date});return !!(q&&q.ok!==false&&(q.daily||q.data));}
  }catch(e){}
  return false;
}
async function guardDate(){
  if(!ONCE[cur]||!$('f_date'))return false;
  const dup=await dateTaken(cur,$('f_date').value);
  $('save').disabled=dup;
  if(dup)setMsg(t('dup'),true);else if($('msg').className==='err')setMsg('');
  return dup;
}

async function fetchPrev(){

}
async function fetchAuto(){
  if(!$('f_cashin'))return;
  try{
    const r=await call('auto',{date:$('f_date').value});
    if(r&&r.ok!==false){
      [['cashin','f_cashin'],['exp','f_exp'],['out','f_out'],['cod','f_cod']].forEach(([k,id])=>{const e=$(id);if(e)e.value=r[k]!=null?r[k]:0});
      calc();
    }

function calc(){
  if(!$('f_prev'))return;
  const v=id=>num($(id).value);
  const total=v('f_prev')+v('f_sale')+v('f_cashin');
  const led=total-v('f_exp')-v('f_out')-v('f_cod');
  let hand=0;document.querySelectorAll('.nq').forEach(i=>{const a=num(i.value)*Number(i.dataset.n);$('na_'+i.dataset.n).textContent=nf(a);hand+=a});
  const diff=hand-led;
  $('s_led').textContent=fmt(led);$('s_hand').textContent=fmt(hand);
  $('k_hand').textContent=fmt(hand);$('k_led').textContent=fmt(led);
  $('k_diff').textContent=(diff>0?'+ ':diff<0?'− ':'')+fmt(Math.abs(diff));
  $('k_box').className='stat '+(diff===0?'ok':'bad');
  $('k_lab').textContent=diff===0?t('match'):diff>0?t('over'):t('short');
}
function collect(){
  const out={};
  if(F[cur].custom){
    out.date=$('f_date').value;
    out.prev=num($('f_prev').value);out.sale=num($('f_sale').value);out.cashin=num($('f_cashin').value);
    out.exp=num($('f_exp').value);out.out=num($('f_out').value);out.cod=num($('f_cod').value);
    out.notes={};let hand=0;document.querySelectorAll('.nq').forEach(i=>{out.notes[i.dataset.n]=num(i.value);hand+=num(i.value)*Number(i.dataset.n)});
    out.total=out.prev+out.sale+out.cashin;
    out.ledger=out.total-out.exp-out.out-out.cod;out.hand=hand;out.diff=hand-out.ledger;
  }else F[cur].fields.forEach(([k])=>out[k]=$('f_'+k).value);
  return out;
}

async function saveEntry(){
  const data=collect();
  if(!data.date){setMsg(t('needdate'),true);return}
  $('save').disabled=true;setMsg(t('saving'));
  if(ONCE[cur]&&await dateTaken(cur,data.date)){setMsg(t('dup'),true);return}
  try{
    const r=await call('add',{sheet:cur,data});
    if(r&&r.duplicate){setMsg(t('dup'),true);return}
    if(r&&r.ok===false){setMsg(r.error||t('net'),true)}
    else{const dt=data.date;buildFields(false);$('f_date').value=dt;await guardDate();setMsg(t('saved'));loadRecent();$('save').disabled=!!(ONCE[cur]);return}
  }catch(e){setMsg(t('net'),true)}
  $('save').disabled=false;
}

  try{
    let b=await window.__sp;
    if(!b){prepShare();b=await window.__sp}
    const f=new File([b],'LizFashion-Report-'+$('d').value+'.jpg',{type:'image/jpeg'});
    if(navigator.canShare&&navigator.canShare({files:[f]})){
      await navigator.share({files:[f],title:'Liz Fashion – '+t('rpt')});
    }else{
      const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=f.name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),2000);
      $('rmsg').style.color='var(--mut)';$('rmsg').textContent=t('noShare');
    }
  }catch(e){if(e&&e.name!=='AbortError'){$('rmsg').style.color='var(--bad)';$('rmsg').textContent=t('shareFail')}}
  $('sh').disabled=false;
}
async function download(){
  $('dl').disabled=true;
  try{
    if(document.fonts&&document.fonts.ready)await document.fonts.ready;
    const c=await html2canvas($('rep'),{scale:3,backgroundColor:'#ffffff',useCORS:true});
    c.toBlob(b=>{const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='LizFashion-Report-'+$('d').value+'.jpg';document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),2000)},'image/jpeg',0.95);
  }catch(e){$('rmsg').style.color='var(--bad)';$('rmsg').textContent='Download failed. Open the page via a web server (not file://) so the logo can be exported.'}
  $('dl').disabled=false;
}

/* ---------- Login ---------- */
async function login(auto){
  const pin=auto||$('pin').value.trim();if(!pin)return;
  $('enter').disabled=true;$('lmsg').textContent='';
  try{
    PIN=pin;const r=await call('login');
    if(r&&r.ok===false){PIN='';if(!auto)$('lmsg').textContent=t('wrongpin');try{localStorage.removeItem('pin')}catch(e){}}
    else{
      try{if($('rem').checked)localStorage.setItem('pin',pin);else localStorage.removeItem('pin')}catch(e){}
      $('lock').hidden=true;$('app').hidden=false;$('logout').hidden=false;$('d').value=today();showTab(cur);
    }
  }catch(e){PIN='';if(!auto)$('lmsg').textContent=t('net')}
  $('enter').disabled=false;
}
function logout(){PIN='';try{localStorage.removeItem('pin')}catch(e){}$('app').hidden=true;$('logout').hidden=true;$('lock').hidden=false;$('pin').value=''}

/* ---------- Events ---------- */
document.querySelector('.lang').addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;lang=b.dataset.l;try{localStorage.setItem('lang',lang)}catch(x){}
  applyI18n();if(!$('app').hidden){if(cur==='report'){if(!$('holder').hidden)loadReport()}else{buildFields(true);loadRecent()}}});
$('tabs').addEventListener('click',e=>{const b=e.target.closest('button');if(b)showTab(b.dataset.tab)});
$('enter').onclick=()=>login();$('pin').addEventListener('keydown',e=>{if(e.key==='Enter')login()});
$('logout').onclick=logout;
$('save').onclick=saveEntry;$('clear').onclick=()=>{buildFields(true);setMsg('')};
$('pv').onclick=()=>{shiftDate(-1);loadReport()};$('nx').onclick=()=>{shiftDate(1);loadReport()};
$('td').onclick=()=>{$('d').value=today();loadReport()};$('load').onclick=loadReport;$('dl').onclick=download;$('sh').onclick=shareReport;
applyI18n();
try{const s=localStorage.getItem('pin');if(s)login(s)}catch(e){}
</script>
</body>
</html>
