<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Liz Fashion – AponBazaar | Daily Accounts</title>
<meta name="theme-color" content="#1F449C">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="logo.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Liz Fashion">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Bengali:wght@400;500;600;700;800&family=Noto+Serif+Bengali:wght@500;600;700;800&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<style>
[hidden]{display:none!important}
:root{
  --blue:#1F449C;--blue-d:#13296a;--blue-l:#e9efff;--blue-xl:#f5f8ff;
  --yellow:#F8B518;--yellow-d:#d99a06;--yellow-l:#fff6dc;
  --ink:#141c33;--mut:#6a7490;--line:#e5e9f3;--bg:#f3f5fa;
  --ok:#12803f;--okbg:#e6f6ed;--bad:#c4281c;--badbg:#fdecea;
  --r:18px;--sh1:0 1px 2px rgba(19,41,106,.06),0 4px 14px rgba(19,41,106,.05);--sh2:0 2px 4px rgba(19,41,106,.05),0 14px 36px rgba(19,41,106,.1);
}
*{box-sizing:border-box}
html{font-family:Inter,"Noto Sans Bengali",system-ui,sans-serif;-webkit-text-size-adjust:100%}
html[lang=bn]{font-family:"Noto Sans Bengali",Inter,system-ui,sans-serif}
body{margin:0;color:var(--ink);font-size:15px;line-height:1.6;min-height:100vh;background:var(--bg);
  background-image:radial-gradient(1100px 380px at 50% -140px,#dbe5fb,transparent 70%)}
html[lang=bn] body{font-size:16px}
button,input,select,textarea{font-family:inherit}
.num,td,th,input[type=number],.stat b{font-variant-numeric:tabular-nums lining-nums}
::selection{background:var(--yellow);color:var(--blue-d)}

/* ---------- Top bar ---------- */
.top{background:linear-gradient(115deg,#0e2054,var(--blue-d) 45%,var(--blue));color:#fff;position:relative;padding-top:env(safe-area-inset-top);box-shadow:0 8px 28px rgba(14,32,84,.28)}
.top:after{content:"";display:block;height:3px;background:linear-gradient(90deg,var(--yellow),#ffe08a,var(--yellow))}
.top .in{max-width:1180px;margin:auto;padding:12px 20px;display:flex;align-items:center;gap:12px}
.brand{display:flex;align-items:center;gap:14px;margin-right:auto;min-width:0}
.brand b{display:block;font-size:18px;font-weight:700;line-height:1.25;letter-spacing:.1px}
.brand span{font-size:11.5px;color:#ffd566;letter-spacing:1.4px;text-transform:uppercase;font-weight:600}
html[lang=bn] .brand span{letter-spacing:0;text-transform:none;font-size:13.5px}
.logo{width:50px;height:50px;border-radius:15px;background:#fff center/160% no-repeat;flex:none;
  box-shadow:0 0 0 3px rgba(255,255,255,.2),0 8px 18px rgba(0,0,0,.28);display:flex;align-items:center;justify-content:center;color:var(--blue);font-weight:800;font-size:17px}
.logo.ok{background-image:var(--logo);font-size:0}
.lang{display:flex;background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.14);border-radius:999px;padding:3px}
.lang button{border:0;background:transparent;color:#d6e1fb;padding:6px 14px;border-radius:999px;font-size:13px;cursor:pointer;font-weight:500;transition:.15s}
.lang button.on{background:var(--yellow);color:var(--blue-d);font-weight:700;box-shadow:0 3px 8px rgba(0,0,0,.2)}
.lockb{background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.16);color:#fff;padding:8px 15px;border-radius:999px;font-size:13px;font-weight:600;cursor:pointer;transition:.15s}
.lockb:hover{background:rgba(255,255,255,.22)}

/* ---------- Layout: sidebar on desktop ---------- */
#app{max-width:1180px;margin:0 auto;padding:24px 20px 60px;display:grid;grid-template-columns:232px minmax(0,1fr);gap:26px;align-items:start}
nav{position:sticky;top:18px;background:#fff;border:1px solid var(--line);border-radius:20px;padding:10px;box-shadow:var(--sh1)}
nav .in{display:flex;flex-direction:column;gap:4px}
nav button{display:flex;align-items:center;gap:12px;width:100%;border:0;background:transparent;padding:9px 12px;border-radius:13px;font-weight:600;font-size:14.5px;color:#4b5573;cursor:pointer;transition:.15s;text-align:left;white-space:nowrap}
nav button .ic{width:34px;height:34px;border-radius:10px;background:var(--blue-l);display:grid;place-items:center;font-size:17px;line-height:1;transition:.15s;flex:none}
nav button:hover{background:var(--blue-xl);color:var(--blue)}
nav button.on{background:linear-gradient(135deg,var(--blue),var(--blue-d));color:#fff;box-shadow:0 8px 18px rgba(31,68,156,.32)}
nav button.on .ic{background:rgba(255,255,255,.18)}
main{min-width:0;padding:0}

/* ---------- Cards & forms ---------- */
.card{background:#fff;border:1px solid var(--line);border-radius:22px;padding:28px;box-shadow:var(--sh2)}
h2,h3{display:flex;align-items:center;gap:9px;color:var(--blue-d);font-weight:700}
h2:before,h3:before{content:"";width:4px;height:17px;border-radius:4px;background:var(--yellow);flex:none}
h2{font-size:13px;margin:30px 0 12px;text-transform:uppercase;letter-spacing:1px}
h3{font-size:13px;margin:0 0 6px;padding-bottom:10px;border-bottom:1px solid var(--line);text-transform:uppercase;letter-spacing:.9px}
html[lang=bn] h2,html[lang=bn] h3{text-transform:none;letter-spacing:0;font-size:17px}
label{display:block;font-size:13px;font-weight:600;color:#4b5573;margin:16px 0 6px}
input,select,textarea{width:100%;padding:12px 14px;border:1.5px solid #dde3f0;border-radius:13px;font-size:inherit;color:var(--ink);background:#fafbfe;transition:.15s}
textarea{min-height:88px;resize:vertical}
input:hover,select:hover,textarea:hover{border-color:#c4cde3}
input:focus,select:focus,textarea:focus{outline:0;border-color:var(--blue);background:#fff;box-shadow:0 0 0 4px rgba(31,68,156,.13)}
button:focus-visible{outline:2px solid var(--yellow);outline-offset:2px}
input.lk{background:#eef1f7;color:var(--mut);pointer-events:none}
.btns{display:flex;gap:10px;margin-top:24px}
.btn{padding:13px 22px;border-radius:13px;border:1.5px solid #dde3f0;background:#fff;color:var(--ink);font-weight:600;font-size:inherit;cursor:pointer;transition:.16s}
.btn:hover{border-color:var(--blue);color:var(--blue);transform:translateY(-1px)}
.btn.pri{flex:1;background:linear-gradient(135deg,#2a56bd,var(--blue-d));border-color:var(--blue-d);color:#fff;box-shadow:0 10px 22px rgba(31,68,156,.3)}
.btn.pri:hover{color:#fff;filter:brightness(1.08);box-shadow:0 14px 28px rgba(31,68,156,.36)}
.btn.gold{background:linear-gradient(135deg,#ffd75f,var(--yellow));border-color:var(--yellow-d);color:var(--blue-d);font-weight:700;box-shadow:0 10px 22px rgba(248,181,24,.38)}
.btn.gold:hover{color:var(--blue-d);filter:brightness(1.04)}
.btn.dng{background:linear-gradient(135deg,#e4574a,var(--bad));border-color:var(--bad);color:#fff;box-shadow:0 10px 22px rgba(196,40,28,.28)}
.btn.dng:hover{color:#fff}
.btn:disabled{opacity:.45;cursor:default;box-shadow:none;transform:none}
.btn.busy{position:relative;color:transparent!important;pointer-events:none}
.btn.busy:disabled{opacity:1}
.btn.busy:after{content:"";position:absolute;left:50%;top:50%;width:20px;height:20px;margin:-10px 0 0 -10px;border:3px solid rgba(255,255,255,.4);border-top-color:#fff;border-radius:50%;animation:sp .7s linear infinite}
.btn.gold.busy:after{border-color:rgba(19,41,106,.25);border-top-color:var(--blue-d)}
@keyframes sp{to{transform:rotate(360deg)}}
#msg{margin-top:12px;min-height:24px;color:var(--ok);font-weight:600}
#msg.err,#lmsg{color:var(--bad)}
.nh{margin:4px 2px 0;font-size:13px;font-weight:700;color:var(--blue)}
.nh:empty{display:none}
.dw{margin-top:8px;padding:9px 13px;border-radius:11px;background:var(--yellow-l);border:1px solid #f1d27c;color:#8a5a00;font-size:13.5px;font-weight:600}
.dtog{display:block;margin-top:6px;background:none;border:0;color:var(--blue);font-size:13px;font-weight:600;cursor:pointer;text-decoration:underline;padding:0}

/* toast / offline */
#toast{position:fixed;left:50%;top:18px;z-index:80;transform:translate(-50%,-140%);opacity:0;pointer-events:none;background:var(--ok);color:#fff;padding:12px 24px;border-radius:999px;font-weight:700;box-shadow:0 16px 38px rgba(0,0,0,.3);transition:.35s cubic-bezier(.2,.9,.3,1.2);max-width:92vw;text-align:center;font-size:15px}
#toast.show{transform:translate(-50%,0);opacity:1}
#toast.err{background:var(--bad)}
#offline{position:fixed;left:0;right:0;top:0;z-index:90;padding:calc(8px + env(safe-area-inset-top)) 14px 8px;background:var(--bad);color:#fff;text-align:center;font-weight:700;font-size:14px;box-shadow:0 6px 18px rgba(0,0,0,.25)}

/* ---------- Cash summary ---------- */
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin:24px 0 4px}
.stat{border:1px solid var(--line);border-radius:16px;padding:15px 18px;background:linear-gradient(180deg,#fff,var(--blue-xl));position:relative;overflow:hidden}
.stat:before{content:"";position:absolute;left:0;top:0;bottom:0;width:5px;background:var(--blue)}
.stat small{display:block;color:var(--mut);font-size:13px;font-weight:600}
.stat b{display:block;font-size:26px;font-weight:700;margin-top:2px}
.stat.ok{background:var(--okbg);border-color:#bfe6cd}.stat.ok:before{background:var(--ok)}.stat.ok b{color:var(--ok)}
.stat.bad{background:var(--badbg);border-color:#f3c3be}.stat.bad:before{background:var(--bad)}.stat.bad b{color:var(--bad)}
.cols{display:grid;grid-template-columns:1fr 1fr;gap:34px;margin-top:10px}
.sum{display:flex;justify-content:space-between;align-items:center;padding:13px 16px;margin-top:16px;border-radius:14px;background:var(--yellow-l);border:1px solid #f1d27c;font-weight:700;color:var(--blue-d)}
.autohd{margin-top:18px;padding:9px 13px;border-radius:11px;background:var(--blue-l);color:var(--blue);font-size:13px;font-weight:600}

/* ---------- Tables ---------- */
table{border-collapse:collapse;width:100%;font-size:14px}
th,td{padding:12px 14px;text-align:left;white-space:nowrap;border-bottom:1px solid var(--line)}
th{background:#f0f4fc;color:#4b5573;font-weight:700;font-size:12.5px;letter-spacing:.2px}
tbody tr{transition:background .12s}
tbody tr:hover td{background:var(--blue-xl)}
tbody tr:last-child td{border-bottom:0}
.tbl{overflow-x:auto;background:#fff;border:1px solid var(--line);border-radius:18px;box-shadow:var(--sh1)}
.tbl.tall{max-height:70vh;overflow:auto}
.tbl.tall th{position:sticky;top:0;z-index:1}
.empty{padding:34px 20px;color:var(--mut);text-align:center}
.empty .ei{display:block;font-size:36px;margin-bottom:4px}
table.notes{margin-top:10px}
table.notes th{background:transparent}
table.notes td{padding:6px 8px}
table.notes input{padding:8px 10px;text-align:right}
table.notes td.r,table.notes th.r{text-align:right}
table.notes td:first-child{font-weight:700;color:var(--blue)}
table.notes tbody tr:hover td{background:transparent}
td.act{white-space:nowrap;text-align:right}
.bdg{display:inline-block;padding:3px 12px;border-radius:999px;font-size:12.5px;font-weight:700}
.bdg.pd{background:#fff3d2;color:#8a5a00}.bdg.dn{background:#e3f6ea;color:#12803f}.bdg.ap{background:#e6edff;color:#1F449C}
.ib{border:0;background:var(--blue-l);border-radius:10px;width:36px;height:36px;font-size:16px;cursor:pointer;margin-left:6px;transition:.15s}
.ib:hover{background:var(--yellow-l);transform:translateY(-1px)}
.rh{display:flex;align-items:flex-end;justify-content:space-between;gap:10px}
.btn.sm{padding:8px 16px;font-size:14px;border-radius:999px;margin-bottom:8px}
.rq{margin:0 0 12px}

/* ---------- Home ---------- */
.hello h1{margin:2px 0 0;font-size:28px;color:var(--blue-d);line-height:1.3;font-weight:800}
.hello p{margin:0;color:var(--mut)}
.hs{margin-top:18px;padding:20px 24px;border-radius:20px;display:flex;justify-content:space-between;align-items:center;gap:14px;border:1px solid transparent;border-left:8px solid var(--c);background:var(--b);box-shadow:var(--sh1)}
.hs.ok,.hs.ov{--c:var(--ok);--b:var(--okbg);border-color:#bfe6cd}.hs.sh{--c:var(--bad);--b:var(--badbg);border-color:#f3c3be}.hs.none{--c:var(--yellow-d);--b:var(--yellow-l);border-color:#f1d27c}
.hs .lb{font-size:19px;font-weight:800;color:var(--c)}
.hs .sb{font-size:13.5px;color:var(--ink);line-height:1.65}
.hs .big{font-size:30px;font-weight:800;color:var(--c);white-space:nowrap;font-variant-numeric:tabular-nums}
.hs .btn{flex:none;padding:10px 18px}
.hgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-top:16px}
.hc{border-radius:18px;padding:16px 18px;box-shadow:var(--sh1)}
.hc small{display:block;font-size:13px;font-weight:600;opacity:.85}
.hc b{display:block;font-size:21px;font-weight:800;font-variant-numeric:tabular-nums;margin-top:2px}
.hc:nth-child(1){background:#d3f8ef;color:#0f766e}.hc:nth-child(2){background:#e3e9ff;color:#3730a3}
.hc:nth-child(3){background:#ffe6e9;color:#be123c}.hc:nth-child(4){background:#fdf0a3;color:#713f12}
.quick{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.quick button{display:flex;align-items:center;gap:12px;padding:15px 18px;border-radius:16px;border:1px solid var(--line);background:#fff;font-weight:600;font-size:inherit;color:var(--ink);cursor:pointer;box-shadow:var(--sh1);transition:.16s;text-align:left}
.quick button:hover{border-color:var(--blue);color:var(--blue);transform:translateY(-3px);box-shadow:var(--sh2)}
.quick .ic{font-size:22px;width:44px;height:44px;border-radius:13px;background:var(--blue-l);display:grid;place-items:center;flex:none}

/* ---------- Modal ---------- */
#modal{position:fixed;inset:0;z-index:60;background:rgba(12,22,52,.55);backdrop-filter:blur(5px);display:flex;align-items:center;justify-content:center;padding:16px}
.mbox{background:#fff;border-radius:22px;padding:24px;width:100%;max-width:450px;max-height:90vh;overflow:auto;box-shadow:0 34px 80px rgba(0,0,0,.42);border-top:5px solid var(--yellow)}
.mbox p{margin:12px 0 8px}
.dsum{background:var(--blue-xl);border:1px solid var(--line);border-radius:14px;padding:11px 15px;font-size:14px;line-height:1.75}

/* ---------- Login ---------- */
#lock{padding:20px;min-height:calc(100vh - 80px);display:flex;align-items:center;justify-content:center;background:radial-gradient(700px 420px at 15% 0,#3563cf,transparent 70%),radial-gradient(600px 400px at 100% 100%,#0e2054,transparent 70%),var(--blue-d)}
#lock .card{width:100%;max-width:410px;padding:38px 30px;text-align:center;border-top:6px solid var(--yellow);border-radius:26px;box-shadow:0 40px 90px rgba(0,0,0,.45)}
#lock .logo{margin:0 auto 16px;width:96px;height:96px;border-radius:26px;box-shadow:0 0 0 1px var(--line),0 14px 30px rgba(21,47,112,.18);background-color:#fff;background-size:150%}
#lock h1{font-size:24px;margin:0 0 4px;color:var(--blue-d);font-weight:800}
#lock p{margin:0 0 6px;color:var(--mut)}
#lock input{text-align:center;letter-spacing:10px;font-size:22px;padding:14px}
.rem{display:flex;align-items:center;justify-content:center;gap:8px;margin:18px 0 0;font-weight:500;cursor:pointer}.rem input{width:auto;accent-color:var(--blue)}

/* ---------- Report page ---------- */
.ctl{background:#fff;border:1px solid var(--line);border-radius:20px;padding:18px 20px;display:flex;gap:12px;align-items:flex-end;flex-wrap:wrap;box-shadow:var(--sh2)}
.ctl label{margin:0 0 6px}.dn{display:flex;gap:6px}.dn input{width:auto}.ctl .btn{padding:11px 16px}.ctl .btn.pri{flex:none}
#rmsg{color:var(--bad);font-size:14px;min-height:20px;margin:10px 2px 0}
.stage{overflow-x:auto;padding:16px 0 22px}
.holder{width:600px;margin:0 auto;border-radius:10px;box-shadow:0 28px 64px rgba(21,47,112,.32)}
.dlbar{max-width:600px;margin:0 auto;display:flex;gap:10px}.dlbar .btn{flex:1;padding:16px;font-size:16px}

/* ---------- Tablet / mobile ---------- */
@media(max-width:900px){
  #app{display:block;padding:18px 14px 40px}
  body{padding-bottom:calc(82px + env(safe-area-inset-bottom))}
  nav{position:fixed;top:auto;bottom:0;left:0;right:0;z-index:20;border:0;border-top:1px solid var(--line);border-radius:20px 20px 0 0;padding:6px 6px calc(6px + env(safe-area-inset-bottom));background:rgba(255,255,255,.94);backdrop-filter:blur(14px);box-shadow:0 -10px 30px rgba(19,41,106,.12)}
  nav .in{flex-direction:row;gap:2px;justify-content:space-between;overflow-x:auto}
  nav button{flex:1 0 auto;flex-direction:column;gap:2px;width:auto;padding:6px 8px;min-width:52px;font-size:10.5px;border-radius:13px;line-height:1.25;text-align:center}
  nav button .ic{width:auto;height:auto;background:none;font-size:20px;border-radius:0}
  nav button.on{box-shadow:none;background:var(--blue)}
  nav button.on .ic{background:none}
  #toast{top:auto;bottom:calc(98px + env(safe-area-inset-bottom));transform:translate(-50%,140%)}
  #toast.show{transform:translate(-50%,0)}
}
@media(max-width:720px){
  .top .in{padding:10px 14px}.brand b{font-size:16px}.logo{width:44px;height:44px;border-radius:13px}
  .card{padding:20px;border-radius:20px}
  .cols{grid-template-columns:1fr;gap:8px}.stats{grid-template-columns:1fr}.stat b{font-size:22px}
  .hgrid{grid-template-columns:1fr 1fr}.quick{grid-template-columns:1fr 1fr}.quick button{padding:12px}
  .hello h1{font-size:23px}.hs{flex-wrap:wrap;padding:18px}.hs .big{font-size:25px}
}

/* ================= SQUARE REPORT 600x600 — OCEAN ================= */
#rep{width:600px;height:600px;position:relative;overflow:hidden;display:flex;flex-direction:column;background:#effaff;color:#1a2033;
  font:500 13px/1.3 "Noto Sans Bengali",Inter,sans-serif;font-variant-numeric:lining-nums}
#rep *{box-sizing:border-box}#rep p{margin:0}
#rep .hd{background:linear-gradient(110deg,#0ea5e9,#2563eb);color:#fff;padding:14px 22px;display:flex;align-items:center;gap:14px}
#rep .lg{width:50px;height:50px;border-radius:50%;background:#fff center/155% no-repeat;color:#1d4ed8;font-weight:800;font-size:17px;display:flex;align-items:center;justify-content:center;flex:none}
#rep .lg.ok{background-image:var(--logo);font-size:0}
#rep .nm{flex:1}#rep .nm b{display:block;font-size:20px;font-weight:800;line-height:1.2}#rep .nm span{font-size:13.5px;opacity:.9}
#rep .dd{text-align:right}#rep .dd b{display:block;font-size:14px;font-weight:700}#rep .dd span{display:block;font-size:11.5px;opacity:.85}
#rep .dd .wd{font-size:13px;font-weight:800;opacity:1;color:#fef08a}
#rep .st{margin:12px 22px 0;height:90px;padding:8px 14px 8px 16px;border-radius:14px;background:var(--sb);border-left:7px solid var(--sc);display:flex;align-items:center;justify-content:space-between;box-shadow:0 3px 10px rgba(0,0,0,.07)}
#rep .st.sh{--sc:#dc2626;--sb:#fff0f0}#rep .st.ov,#rep .st.ok{--sc:#16a34a;--sb:#ecfaf1}
#rep .st .fg{line-height:1.65;font-size:13.5px;min-width:0}#rep .st .lb{font-size:18px;font-weight:800;color:var(--sc);line-height:1.3}#rep .st .fg b{font-weight:800}
#rep .stamp{flex:none;width:132px;height:78px;border-radius:50%;border:4px double var(--sc);color:var(--sc);display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;transform:rotate(-8deg);line-height:1.2;background:rgba(255,255,255,.65)}
#rep .stamp span{font-size:12.5px;font-weight:800}#rep .stamp b{font-weight:800;white-space:nowrap}
#rep .cd{margin:10px 22px 0;display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
#rep .cd div{border-radius:14px;padding:8px 10px}#rep .cd small{display:block;font-size:12.5px;font-weight:600;opacity:.85;white-space:nowrap}
#rep .cd b{display:block;font-size:16px;font-weight:800;line-height:1.3;white-space:nowrap}
#rep .cd div:nth-child(1){background:#ccfbf1;color:#0f766e}#rep .cd div:nth-child(2){background:#e0e7ff;color:#3730a3}
#rep .cd div:nth-child(3){background:#ffe4e6;color:#be123c}#rep .cd div:nth-child(4){background:#fef08a;color:#713f12}
#rep .tb{flex:1;min-height:0;margin:10px 22px 0;display:grid;grid-template-columns:1fr 1fr;gap:14px}
#rep .box{background:#fff;border-radius:14px;overflow:hidden;box-shadow:0 3px 10px rgba(0,0,0,.07)}

/* ---------- Toast ---------- */
let _tt;
function toast(s,err){const e=$('toast');e.textContent=s;e.className='show'+(err?' err':'');clearTimeout(_tt);_tt=setTimeout(()=>{e.className=''},2800)}

async function dateTaken(sheet,date){
  try{
    const r=await call('exists',{sheet,date});
    if(r&&typeof r.exists==='boolean')return r.exists;
    if(sheet==='daily'){const q=await call('report',{date});return !!(q&&q.ok!==false&&(q.daily||q.data));}
  }catch(e){}
  return false;
}
async function guardDate(){
  if(!ONCE[cur]||!$('f_date'))return false;
  const dup=await dateTaken(cur,$('f_date').value);
  $('save').disabled=dup;
  if(dup)setMsg(t('dup'),true);else if($('msg').className==='err')setMsg('');
  return dup;
}

/* ---------- API ----------
   POST text/plain JSON: {action, pin, ...}
   actions: login | add{sheet,data} | recent{sheet} | prev{date} | auto{date} | exists{sheet,date} | report{date}
   Adjust this one function + the action names if your Apps Script differs. */
async function call(act,data={}){
  const r=await fetch(APP_URL,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({action:act,pin:PIN,...data})});
  return r.json();
}

  document.querySelectorAll('[data-i]').forEach(e=>e.textContent=t(e.dataset.i));
  document.querySelectorAll('.lang button').forEach(b=>b.classList.toggle('on',b.dataset.l===lang));

  const cfg=F[cur];const box=$('fields');const oldDate=keepDate&&$('f_date')?$('f_date').value:today();
  if(cfg.custom){ buildDaily(oldDate); return; }
  box.innerHTML=cfg.fields.map(([k,lab,type,opts])=>{
    const id='f_'+k;let inp;
    if(type==='select')inp=`<select id="${id}">${opts.map(o=>`<option value="${esc(o[0])}">${esc(t(o[1]))}</option>`).join('')}</select>`;
    else if(type==='textarea')inp=`<textarea id="${id}"></textarea>`;
    else inp=`<input id="${id}" type="${type}" ${type==='number'?'inputmode="decimal" min="0" step="any"':''}>`;

async function fetchPrev(){
  const p=$('f_prev');if(!p)return;
  try{const r=await call('prev',{date:$('f_date').value});if(r&&r.ok!==false&&r.prev!=null){p.value=r.prev;calc();}}catch(e){}
}
async function fetchAuto(){
  if(!$('f_cashin'))return;
  try{
    const r=await call('auto',{date:$('f_date').value});
    if(r&&r.ok!==false){
      [['cashin','f_cashin'],['exp','f_exp'],['out','f_out'],['cod','f_cod']].forEach(([k,id])=>{const e=$(id);if(e)e.value=r[k]!=null?r[k]:0});
      calc();
    }
  }catch(e){}
}
function calc(){
  if(!$('f_prev'))return;
  const v=id=>num($(id).value);
  const total=v('f_prev')+v('f_sale')+v('f_cashin');
  const led=total-v('f_exp')-v('f_out')-v('f_cod');
  let hand=0;document.querySelectorAll('.nq').forEach(i=>{const a=num(i.value)*Number(i.dataset.n);$('na_'+i.dataset.n).textContent=nf(a);hand+=a});
  const diff=hand-led;
  $('s_led').textContent=fmt(led);$('s_hand').textContent=fmt(hand);
  $('k_hand').textContent=fmt(hand);$('k_led').textContent=fmt(led);
  $('k_diff').textContent=(diff>0?'+ ':diff<0?'− ':'')+fmt(Math.abs(diff));
  $('k_box').className='stat '+(diff===0?'ok':'bad');
  $('k_lab').textContent=diff===0?t('match'):diff>0?t('over'):t('short');
}
function collect(){
  const out={};
  if(F[cur].custom){
    out.date=$('f_date').value;
    out.prev=num($('f_prev').value);out.sale=num($('f_sale').value);out.cashin=num($('f_cashin').value);
    out.exp=num($('f_exp').value);out.out=num($('f_out').value);out.cod=num($('f_cod').value);
    out.notes={};let hand=0;document.querySelectorAll('.nq').forEach(i=>{out.notes[i.dataset.n]=num(i.value);hand+=num(i.value)*Number(i.dataset.n)});
    out.total=out.prev+out.sale+out.cashin;
    out.ledger=out.total-out.exp-out.out-out.cod;out.hand=hand;out.diff=hand-out.ledger;
  }else F[cur].fields.forEach(([k])=>out[k]=$('f_'+k).value);
  return out;
}

/* reason suggestions (from earlier entries) */
const SUG={};
async function loadSugg(){
  if(!(cur==='expense'||cur==='cash')||!$('f_note'))return;
  const sheet=cur;
  if(!SUG[sheet]){
    try{
      const r=await call('list',{sheet,limit:0});
      const rows=(r&&r.ok!==false&&Array.isArray(r.rows))?r.rows:[];
      const cnt={};
      rows.forEach(o=>{const v=String(o['Note']||o['Reason']||o['note']||o['Expense Name']||'').trim();if(v)cnt[v]=(cnt[v]||0)+1});
      SUG[sheet]=Object.keys(cnt).sort((a,b)=>cnt[b]-cnt[a]).slice(0,40);
    }catch(e){SUG[sheet]=[]}
  }
  if(cur!==sheet||!$('f_note'))return;
  let dl=$('sg_note');
  if(!dl){dl=document.createElement('datalist');dl.id='sg_note';$('fields').appendChild(dl)}
  dl.innerHTML=SUG[sheet].map(v=>`<option value="${esc(v)}">`).join('');
  $('f_note').setAttribute('list','sg_note');
  $('f_note').setAttribute('autocomplete','off');
}
/* warn on old / future date */
function dateWarn(){
  const el=$('f_date');if(!el)return;
  let w=$('dwarn');
  if(!w){w=document.createElement('div');w.id='dwarn';w.className='dw';el.after(w)}
  const v=el.value;let msg='';
  if(v){
    const diff=Math.round((new Date(v+'T00:00:00')-new Date(today()+'T00:00:00'))/864e5);
    if(diff>0)msg=t('dwFut');else if(diff<-3)msg=t('dwOld').replace('{n}',nf(-diff));
  }
  w.textContent=msg;w.hidden=!msg;
}
/* status dropdown used inside the edit popup */
const STV=[['pending','st_pending'],['entry done','st_done'],['approved','st_approved']];
function statusSel(i,k,cur0){
  const lc=String(cur0).toLowerCase();let found=false;
  let opts=STV.map(([v,l])=>{const sel=v===lc;if(sel)found=true;return `<option value="${esc(sel?cur0:v)}"${sel?' selected':''}>${esc(t(l))}</option>`}).join('');
  if(!found)opts=`<option value="${esc(cur0)}" selected>${esc(cur0)}</option>`+opts;
  return `<select id="e_${i}" data-k="${esc(k)}">${opts}</select>`;
}
/* duplicate entry check (same date + amount + reason) */
async function findDup(data){
  if(!num(data.amount))return false;
  try{
    const r=await call('list',{sheet:cur,limit:0});
    const rows=(r&&r.ok!==false&&Array.isArray(r.rows))?r.rows:[];
    const txt=String(data.note||data.name||data.custName||'').trim().toLowerCase();
    return rows.some(o=>{
      const d=String(o['Date']||o['date']||'').slice(0,10);
      if(d!==data.date)return false;
      if(num(o['Amount']!=null?o['Amount']:o['amount'])!==num(data.amount))return false;
      const rt=String(o['Note']||o['Reason']||o['Customer Name']||o['Name']||o['note']||'').trim().toLowerCase();
      return !txt||!rt||rt===txt;
    });
  }catch(e){return false}
}
/* save: cash summary asks for confirmation first */
function saveEntry(){
  const data=collect();
  if(!data.date){setMsg(t('needdate'),true);return}
  if(F[cur].custom){
    const d=data.diff;
    const lab=d===0?t('match'):d>0?t('over'):t('short');
    openModal(t('cfTitle'),`<div class="dsum"><div><b>${t('date')}:</b> ${esc(longDate(data.date))}</div><div><b>${t('handlab')}:</b> ${fmt(data.hand)}</div><div><b>${t('ledlab')}:</b> ${fmt(data.ledger)}</div><div><b>${lab}:</b> ${d?fmt(Math.abs(d)):'✓'}</div></div>`,
      t('cfOk'),false,async()=>{closeModal();await doSave()});
    return;
  }
  (async()=>{
    const go=async()=>{
      const b=$('save');b.disabled=true;
      const dup=await findDup(data);
      b.disabled=false;
      if(dup){
        const txt=data.note||data.name||data.custName||'';
        openModal(t('dupT'),`<p>${t('dupAsk')}</p><div class="dsum"><div><b>${t('date')}:</b> ${esc(longDate(data.date))}</div>${txt?`<div>${esc(txt)}</div>`:''}<div><b>${t('amount')}:</b> ${fmt(data.amount)}</div></div>`,
          t('dupOk'),false,async()=>{closeModal();await doSave()});
        return;
      }
      doSave();
    };
    if(num(data.amount)>=BIG_AMOUNT){
      openModal(t('bigT'),`<p>${t('bigAsk')}</p><div class="dsum"><div><b>${t('amount')}:</b> ${fmt(data.amount)}</div></div>`,
        t('bigOk'),false,async()=>{closeModal();await go()});
      return;
    }
    await go();
  })();
}
async function doSave(){
  const data=collect();
  if(!data.date){setMsg(t('needdate'),true);return}
  const b=$('save');b.disabled=true;b.classList.add('busy');setMsg(t('saving'));
  try{
    if(ONCE[cur]&&await dateTaken(cur,data.date)){setMsg(t('dup'),true);return}
    const r=await call('add',{sheet:cur,data});
    if(r&&r.duplicate){setMsg(t('dup'),true);return}
    if(r&&r.ok===false){setMsg(r.error||t('net'),true);b.disabled=false;return}
    delete SUG[cur];
    buildFields(false);if(!ONCE[cur])b.disabled=false;await guardDate();setMsg(t('saved'));loadRecent();
  }catch(e){setMsg(t('net'),true);b.disabled=false}
  finally{b.classList.remove('busy')}
}

let showAll=false,rowsCache=[],canEdit=true,rq='',mAct=null;

  $('rtitle').textContent=showAll?t('allT')+(n!=null?' ('+nf(n)+')':''):t('recent5');

async function loadRecent(){
  const box=$('recent');recTitle();box.className='tbl'+(showAll?' tall':'');
  box.innerHTML=`<div class="empty">${t('loading')}</div>`;
  try{
    let rows,total=null;
    let r=await call('list',{sheet:cur,limit:showAll?0:5});
    if(r&&r.ok!==false&&Array.isArray(r.rows)){rows=r.rows;total=r.total;canEdit=true}
    else{
      r=await call('recent',{sheet:cur});

/* table cell: status as colored badge, everything else plain text */
function cell(k,v){
  if(k==='Status'||k==='status'){
    const s=String(v||'').toLowerCase();
    const c=s.includes('approved')?'ap':s.includes('done')?'dn':'pd';
    return `<span class="bdg ${c}">${esc(v)}</span>`;
  }
  return esc(v);
}
function renderRows(){
  const box=$('recent');let rows=rowsCache;

  if(!rows.length){box.innerHTML=`<div class="empty"><span class="ei">📭</span>${t('none')}</div>`;return}
  const keys=Object.keys(rowsCache[0]).filter(k=>k!=='_row'&&!(cur==='expense'&&(k==='Expense Name'||k==='name')));
  box.innerHTML=`<table><thead><tr>${keys.map(k=>`<th>${esc(hdr(k))}</th>`).join('')}${canEdit?'<th></th>':''}</tr></thead><tbody>${
    rows.map(o=>`<tr>${keys.map(k=>`<td>${cell(k,o[k])}</td>`).join('')}${canEdit?`<td class="act"><button class="ib" data-e="${o._row}" aria-label="${t('editEntry')}">✏️</button><button class="ib" data-d="${o._row}" aria-label="${t('delete')}">🗑️</button></td>`:''}</tr>`).join('')}</tbody></table>`;
}

async function checkPin(){

function openEditForm(o){

async function sendMut(act,payload,okMsg){
  const b=$('mok');b.disabled=true;b.classList.add('busy');
  try{
    const r=await call(act,{sheet:cur,...payload});
    if(r&&r.ok===false){
      const stale=r.error==='stale';
      toast(stale?t('stale'):(r.error||t('net')),true);
      b.classList.remove('busy');b.disabled=false;
      if(stale){closeModal();loadRecent()}
      return;
    }
    closeModal();toast(okMsg);loadRecent();
  }catch(e){toast(t('net'),true);b.classList.remove('busy');b.disabled=false}
}

/* ---------- Report ---------- */
function shiftDate(n){const d=new Date($('d').value||today());d.setDate(d.getDate()+n);$('d').value=new Date(d-d.getTimezoneOffset()*6e4).toISOString().slice(0,10)}
function longDate(s){try{return new Date(s+'T00:00:00').toLocaleDateString(loc(),{day:'numeric',month:'long',year:'numeric'})}catch(e){return s}}
function weekDay(s){try{return new Date(s+'T00:00:00').toLocaleDateString(loc(),{weekday:'long'})}catch(e){return ''}}
async function loadReport(){
  const ds=$('d').value;$('rmsg').textContent='';
  if(!ds){$('rmsg').textContent=t('needdate');return}
  $('load').disabled=true;$('rmsg').textContent=t('loading');$('rmsg').style.color='var(--mut)';
  try{
    const r=await call('report',{date:ds});
    let d=r&&(r.daily||r.data);
    if(!d||r.ok===false){$('holder').hidden=true;$('dl').disabled=true;$('sh').disabled=true;$('rmsg').style.color='var(--bad)';$('rmsg').textContent=t('noDaily');}
    else{drawReport(ds,d);$('rmsg').textContent='';}
  }catch(e){$('rmsg').style.color='var(--bad)';$('rmsg').textContent=t('net')}
  $('load').disabled=false;
}
function pick(d,...ks){for(const k of ks)if(d[k]!=null&&d[k]!=='')return num(d[k]);return 0}
function calcR(d){
  const prev=pick(d,'prev','Previous Ledger'),sale=pick(d,'sale','Ajker Cash Sell'),ci=pick(d,'cashin','Cash In');
  const exp=pick(d,'exp','Expense'),out=pick(d,'out','Cash Out (Deposit)'),cod=pick(d,'cod','COD');
  const total=(d.total!=null||d.Total!=null)?pick(d,'total','Total'):prev+sale+ci;
  const led=(d.ledger!=null||d['Ledger Amount']!=null)?pick(d,'ledger','Ledger Amount'):total-exp-out-cod;
  const nt=d.notes||{};let hand=0;
  const rows=NOTES.map(n=>{const q=num(nt[n]!=null?nt[n]:d['N'+n]!=null?d['N'+n]:d[n]);const a=q*n;hand+=a;return [n,q,a]});
  if(d.hand!=null||d['Cash In Hand']!=null){const h=pick(d,'hand','Cash In Hand');if(h)hand=h}
  return {prev,sale,ci,exp,out,cod,total,led,hand,diff:hand-led,rows};
}
function drawReport(ds,d){
  const {prev,sale,ci,exp,out,cod,total,led,hand,diff,rows}=calcR(d);
  const ok=diff===0;
  const label=ok?t('sOk'):diff>0?t('sOver'):t('sShort');
  const R=(l,v,c='')=>`<p class="${c}"><span>${l}</span><b>${c==='r'&&num(v)?'− ':''}${nf(v)}</b></p>`;
  const st=ok?'ok':diff>0?'ov':'sh';
  const amt=ok?'✓':(diff>0?'+ ':'− ')+'৳ '+nf(Math.abs(diff));
  const fs=amt.length>10?13:amt.length>8?15:18;
  const notesBody=(hand>0&&rows.every(x=>!x[1]))
    ?`<p class="nn">${t('noNotes')}</p>`
    :rows.map(([n,q,a])=>`<p class="${q?'':'z'}"><span>৳ ${nf(n)} × ${nf(q)}</span><b>${nf(a)}</b></p>`).join('');
  $('rep').innerHTML=`
   <div class="hd"><div class="lg${window.__logoOK?' ok':''}">AB</div>
     <div class="nm"><b>Liz Fashion – AponBazaar</b><span>${t('rpt')}</span></div>
     <div class="dd"><b>${esc(longDate(ds))}</b><span class="wd">${esc(weekDay(ds))}</span><span>${t('no')}: LF-${ds.replace(/-/g,'')}</span></div></div>
   <div class="st ${st}"><div class="fg"><div class="lb">${label}</div><div>${t('hand')}: <b>${fmt(hand)}</b></div><div>${t('led')}: <b>${fmt(led)}</b></div></div>
     <div class="stamp"><span>${label}</span><b style="font-size:${fs}px">${amt}</b></div></div>
   <div class="cd"><div><small>${t('ibos')}</small><b>${fmt(sale)}</b></div><div><small>${t('rTotal')}</small><b>${fmt(total)}</b></div><div><small>${t('expense')}</small><b>${fmt(exp)}</b></div><div><small>${t('rFinalS')}</small><b>${fmt(led)}</b></div></div>
   <div class="tb">
     <div class="box l"><h4>${t('secL')}</h4>${R(t('prev'),prev)}${R(t('ibos'),sale)}${R(t('rCashIn'),ci)}${R(t('rTotal'),total,'t')}${R(t('rExp'),exp,'r')}${R(t('rOut'),out,'r')}${R(t('rCod'),cod,'r')}${R(t('rFinal'),led,'f')}<div class="sg"><div>${t('sig')}</div></div></div>
     <div class="box"><h4>${t('secN')}</h4>${notesBody}<p class="f"><span>${t('handsum')}</span><b>${nf(hand)}</b></p></div>
   </div>
   <footer><span><b>Liz Fashion – AponBazaar</b> · ${t('tag')}</span><span>${t('gen')}: ${new Date().toLocaleString(loc(),{dateStyle:'medium',timeStyle:'short'})}</span></footer>`;
  window.__cap=capText(ds,hand,diff);
  $('holder').hidden=false;$('dl').disabled=false;$('sh').disabled=false;prepShare();
}
function capText(ds,hand,diff){
  const dt=new Date(ds+'T00:00:00').toLocaleDateString(loc(),{day:'numeric',month:'long'});
  const st=diff===0?t('sOk')+' ✓':(diff>0?t('sOver'):t('sShort'))+' ৳'+nf(Math.abs(diff));
  return `${dt}, ${weekDay(ds)}, ${t('capTot')} ৳${nf(hand)}, ${st}`;
}
function prepShare(){
  window.__sp=(async()=>{
    await new Promise(r=>setTimeout(r,300));
    if(document.fonts&&document.fonts.ready)await document.fonts.ready;
    const c=await html2canvas($('rep'),{scale:3,backgroundColor:'#ffffff',useCORS:true});
    return await new Promise(res=>c.toBlob(res,'image/png'));
  })().catch(()=>null);
}
async function shareReport(){
  const b0=$('sh');b0.disabled=true;b0.classList.add('busy');
  try{

    if(!b){prepShare();b=await window.__sp}

    if(navigator.canShare&&navigator.canShare({files:[f]})){

      $('rmsg').style.color='var(--mut)';$('rmsg').textContent=t('noShare');

  }catch(e){$('rmsg').style.color='var(--bad)';$('rmsg').textContent='Download failed. Open the page via a web server (not file://) so the logo can be exported.'}

/* ---------- Home dashboard ---------- */
/* number count-up animation */
const bnD=s=>s.replace(/[০-৯]/g,d=>'০১২৩৪৫৬৭৮৯'.indexOf(d));
function countUp(el){
  if(window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches)return;
  const txt=el.textContent,mm=txt.match(/[\d০-৯][\d০-৯,]*/);
  if(!mm)return;
  const end=Number(bnD(mm[0]).replace(/,/g,''));
  if(!end)return;
  const pre=txt.slice(0,mm.index),post=txt.slice(mm.index+mm[0].length),t0=performance.now(),dur=900;
  (function step(now){
    const p=Math.min(1,(now-t0)/dur),e=1-Math.pow(1-p,3);
    el.textContent=pre+Math.round(end*e).toLocaleString(loc())+post;
    if(p<1)requestAnimationFrame(step);
  })(t0);
}
function animateNums(root){root.querySelectorAll('.big,.hc b').forEach(countUp)}

async function yestCheck(){
  const d=new Date();d.setDate(d.getDate()-1);
  const yd=new Date(d-d.getTimezoneOffset()*6e4).toISOString().slice(0,10);
  try{
    const r=await call('report',{date:yd});
    const has=r&&r.ok!==false&&(r.daily||r.data);
    if(has||cur!=='home')return;
    const box=$('homebody'),hello=box&&box.querySelector('.hello');
    if(!hello||$('ybar'))return;
    const el=document.createElement('div');el.id='ybar';el.className='hs none';
    el.innerHTML=`<div><div class="lb">${t('yMiss')}</div><div class="sb">${esc(longDate(yd))} · ${esc(weekDay(yd))}</div></div><button class="btn pri" data-gody="${yd}">${t('hGo')}</button>`;
    hello.after(el);
  }catch(e){}
}
async function loadHome(){
  const ds=today(),box=$('homebody'),hr=new Date().getHours();
  const g=hr<12?t('gMor'):hr<17?t('gAft'):t('gEve');
  const head=`<div class="hello"><h1>${g} 👋</h1><p>${esc(longDate(ds))} · ${esc(weekDay(ds))}</p></div>`;
  const quick=`<h2>${t('t_daily')} · ${t('t_report')}</h2><div class="quick">${['daily','expense','cash','recovery','baki','report'].map(k=>`<button data-go="${k}"><span class="ic">${IC[k]}</span><span>${t('t_'+k)}</span></button>`).join('')}</div>`;
  box.innerHTML=head+`<div class="empty">${t('loading')}</div>`;
  let d=null;
  try{const r=await call('report',{date:ds});if(r&&r.ok!==false)d=r.daily||r.data}
  catch(e){if(cur==='home')box.innerHTML=head+`<div class="empty"><span class="ei">⚠️</span>${t('net')}</div>`+quick;return}
  if(cur!=='home')return;
  if(!d){
    box.innerHTML=head+`<div class="hs none"><div><div class="lb">${t('hNone')}</div><div class="sb">${t('hNoneS')}</div></div><button class="btn pri" data-go="daily">${t('hGo')}</button></div>`+quick;
    yestCheck();
    return;
  }
  const {sale,exp,led,hand,diff}=calcR(d);
  const ok=diff===0,st=ok?'ok':diff>0?'ov':'sh';
  const label=ok?t('sOk'):diff>0?t('sOver'):t('sShort');
  const amt=ok?'✓':(diff>0?'+ ':'− ')+fmt(Math.abs(diff));
  box.innerHTML=head+
   `<div class="hs ${st}"><div><div class="lb">${label}</div><div class="sb">${t('hand')}: <b>${fmt(hand)}</b><br>${t('led')}: <b>${fmt(led)}</b></div></div><div class="big">${amt}</div></div>`+
   `<div class="hgrid"><div class="hc"><small>${t('ibos')}</small><b>${fmt(sale)}</b></div><div class="hc"><small>${t('hand')}</small><b>${fmt(hand)}</b></div><div class="hc"><small>${t('hExp')}</small><b>${fmt(exp)}</b></div><div class="hc"><small>${t('rFinalS')}</small><b>${fmt(led)}</b></div></div>`+quick;
  animateNums(box);
  yestCheck();
}

/* ---------- Login ---------- */
async function login(auto){
  const pin=auto||$('pin').value.trim();if(!pin)return;
  const eb=$('enter');eb.disabled=true;eb.classList.add('busy');$('lmsg').textContent='';
  try{
    PIN=pin;const r=await call('login');
    if(r&&r.ok===false){PIN='';if(!auto)$('lmsg').textContent=t('wrongpin');try{localStorage.removeItem('pin')}catch(e){}}
    else{
      try{if($('rem').checked)localStorage.setItem('pin',pin);else localStorage.removeItem('pin')}catch(e){}
      bump();$('lock').hidden=true;$('app').hidden=false;$('logout').hidden=false;$('d').value=today();showTab(cur);
    }
  }catch(e){PIN='';if(!auto)$('lmsg').textContent=t('net')}
  eb.classList.remove('busy');eb.disabled=false;
}
function logout(){PIN='';try{localStorage.removeItem('pin')}catch(e){}$('app').hidden=true;$('logout').hidden=true;$('lock').hidden=false;$('pin').value=''}

/* ---------- Events ---------- */
document.querySelector('.lang').addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;lang=b.dataset.l;try{localStorage.setItem('lang',lang)}catch(x){}
  applyI18n();
  if(!$('app').hidden){
    if(cur==='home')loadHome();
    else if(cur==='report'){if(!$('holder').hidden)loadReport()}
    else{buildFields(true);loadRecent()}
  }});
$('tabs').addEventListener('click',e=>{const b=e.target.closest('button');if(b)showTab(b.dataset.tab)});
$('homemain').addEventListener('click',e=>{const b=e.target.closest('[data-go]');if(b)showTab(b.dataset.go)});
$('homemain').addEventListener('click',e=>{
  const b=e.target.closest('[data-gody]');if(!b)return;
  const d=b.dataset.gody;showTab('daily');
  const f=$('f_date');if(f){f.value=d;f.dispatchEvent(new Event('change'))}
});
$('enter').onclick=()=>login();$('pin').addEventListener('keydown',e=>{if(e.key==='Enter')login()});
$('logout').onclick=logout;
$('save').onclick=saveEntry;$('clear').onclick=()=>{buildFields(false);setMsg('')};
$('pv').onclick=()=>{shiftDate(-1);loadReport()};$('nx').onclick=()=>{shiftDate(1);loadReport()};
$('td').onclick=()=>{$('d').value=today();loadReport()};$('load').onclick=loadReport;$('dl').onclick=download;$('sh').onclick=shareReport;
$('seeall').onclick=()=>{showAll=!showAll;rq='';$('rq').value='';loadRecent()};
$('rq').addEventListener('input',e=>{rq=e.target.value.trim();renderRows()});
$('recent').addEventListener('click',e=>{
  const b=e.target.closest('button');if(!b)return;
  const isE=b.dataset.e!==undefined,id=isE?b.dataset.e:b.dataset.d;if(id===undefined)return;
  const o=findRow(id);if(!o)return;
  isE?openEdit(o):openDel(o);
});
$('mok').onclick=()=>{if(mAct)mAct()};$('mno').onclick=closeModal;
$('modal').addEventListener('click',e=>{if(e.target.id==='modal')closeModal()});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&!$('modal').hidden)closeModal()});
$('fields').addEventListener('input',numHint);
$('fields').addEventListener('keydown',e=>{
  if(e.key!=='Enter')return;
  const el=e.target;
  if(!el.matches||!el.matches('input,select'))return;
  e.preventDefault();
  const list=[...$('fields').querySelectorAll('input:not([readonly]),select,textarea')].filter(x=>!x.disabled&&x.offsetParent!==null);
  const i=list.indexOf(el);
  if(i>-1&&i<list.length-1)list[i+1].focus();else $('save').focus();
});
/* auto-lock after 5 minutes of inactivity */
const LOCK_MS=5*60*1000;let lastAct=Date.now();
function bump(){lastAct=Date.now()}
['pointerdown','keydown','touchstart','scroll'].forEach(ev=>window.addEventListener(ev,bump,{passive:true,capture:true}));
function chkLock(){
  if(!$('app').hidden&&Date.now()-lastAct>LOCK_MS){closeModal();logout();$('lmsg').textContent=t('alk')}
}
setInterval(chkLock,15000);
document.addEventListener('visibilitychange',()=>{if(!document.hidden)chkLock()});
window.addEventListener('offline',setOff);
window.addEventListener('online',()=>{setOff();toast(t('back'))});
applyI18n();
try{const s=localStorage.getItem('pin');if(s)login(s)}catch(e){}

/* ---------- PWA ---------- */
if('serviceWorker' in navigator&&/^https?:$/.test(location.protocol)){
  window.addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
}
