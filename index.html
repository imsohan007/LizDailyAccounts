<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Liz Fashion – Daily Accounts</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;600;700&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

<style>
[hidden]{display:none!important}
:root{--navy:#0f2742;--navy2:#1b3f66;--gold:#c8a24a;--ink:#1c2733;--mut:#64748b;--line:#dde3ea;--acc:#0f2742;--accbg:#f3e9cf;--okbg:#e3f4ea;--ok:#1b7a43;--badbg:#fdeceb;--bad:#b42318}
*{box-sizing:border-box}
body{margin:0;background:linear-gradient(180deg,#d9e1ec,#eef1f6 360px);color:var(--ink);font:15px/1.55 Inter,"Hind Siliguri",system-ui,sans-serif;min-height:100vh}
.top{background:linear-gradient(120deg,#0b1e34,#16385c);color:#fff;border-bottom:3px solid var(--gold)}
.top .in{max-width:960px;margin:auto;padding:12px 16px;display:flex;align-items:center;justify-content:space-between;gap:12px}
.brand{display:flex;align-items:center;gap:12px}
.brand b{display:block;font-size:17px;font-weight:700}
.brand span{font-size:12.5px;color:#a9bcd3}
.logo{width:40px;height:40px;border-radius:50%;background:var(--gold);color:var(--navy);display:flex;align-items:center;justify-content:center;font-weight:800;font-size:15px;flex:none}
.lang{display:flex;background:rgba(255,255,255,.12);border-radius:8px;padding:3px}
.lang button{border:0;background:transparent;color:#d5e0ee;padding:6px 12px;border-radius:6px;font:inherit;font-size:13px;cursor:pointer}
.lang button.on{background:#fff;color:var(--navy);font-weight:600}
nav{background:#fff;border-bottom:1px solid var(--line);box-shadow:0 2px 8px rgba(15,39,66,.06)}
nav .in{max-width:960px;margin:auto;display:flex;overflow-x:auto;padding:0 8px}
nav button{flex:none;border:0;background:none;padding:14px 16px;font:inherit;font-weight:500;color:var(--mut);cursor:pointer;border-bottom:3px solid transparent}
nav button.on{color:var(--navy);border-bottom-color:var(--gold);font-weight:700}
main{max-width:960px;margin:auto;padding:18px 16px 48px}
.card{background:#fff;border:1px solid var(--line);border-radius:14px;padding:20px;box-shadow:0 4px 14px rgba(15,39,66,.07)}
h2{font-size:15px;margin:26px 0 10px;color:var(--navy);text-transform:uppercase;letter-spacing:.8px}
h3{font-size:14px;margin:0 0 4px;color:var(--navy);padding-bottom:8px;border-bottom:2px solid var(--gold);text-transform:uppercase;letter-spacing:.8px}
label{display:block;font-size:13px;font-weight:600;color:var(--mut);margin:14px 0 5px}
input,select,textarea{width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:9px;font:inherit;color:var(--ink);background:#fff}
input:focus,select:focus,textarea:focus{outline:2px solid var(--gold);outline-offset:0;border-color:var(--gold)}
button:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.btns{display:flex;gap:10px;margin-top:20px}
.btn{padding:12px 18px;border-radius:9px;border:1px solid var(--line);background:#fff;color:var(--ink);font:inherit;font-weight:600;cursor:pointer}
.btn.pri{flex:1;background:var(--navy);border-color:var(--navy);color:#fff}
.btn.gold{background:var(--gold);border-color:var(--gold);color:var(--navy);font-weight:700}
.btn:disabled{opacity:.5;cursor:default}
#msg{margin-top:12px;font-size:14px;min-height:20px;color:var(--ok);font-weight:500}
#msg.err,#lmsg{color:var(--bad)}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin:16px 0 4px}
.stat{border:1px solid var(--line);border-left:4px solid var(--navy);border-radius:12px;padding:12px 14px;background:#fff}
.stat small{display:block;color:var(--mut);font-size:13px}
.stat b{display:block;font-size:26px;font-weight:700;margin-top:2px;font-variant-numeric:tabular-nums}
.stat.ok{background:var(--okbg);border-left-color:var(--ok)}.stat.ok b{color:var(--ok)}
.stat.bad{background:var(--badbg);border-left-color:var(--bad)}.stat.bad b{color:var(--bad)}
.cols{display:grid;grid-template-columns:1fr 1fr;gap:28px;margin-top:14px}
.sum{display:flex;justify-content:space-between;align-items:center;padding:10px 12px;margin-top:14px;border-radius:9px;background:var(--accbg);font-weight:700;color:var(--navy)}
table{border-collapse:collapse;width:100%;font-size:13px}
th,td{padding:8px 10px;text-align:left;white-space:nowrap;border-bottom:1px solid var(--line)}
th{background:var(--navy);color:#fff;font-weight:600}
.tbl{overflow-x:auto;background:#fff;border:1px solid var(--line);border-radius:12px;box-shadow:0 4px 14px rgba(15,39,66,.05)}
table.notes{margin-top:10px}
table.notes td{padding:6px 8px}
table.notes input{padding:7px 8px;text-align:right}
table.notes td.r,table.notes th.r{text-align:right;font-variant-numeric:tabular-nums}
table.notes td:first-child{font-weight:600;color:var(--navy)}
#lock{padding:16px;min-height:calc(100vh - 70px);display:flex;align-items:center;justify-content:center;background:radial-gradient(circle at 20% 10%,#1d4268,#0b1e34 70%)}
#lock .card{width:100%;max-width:360px;padding:30px 26px;text-align:center;border-top:5px solid var(--gold);border-radius:18px;box-shadow:0 20px 50px rgba(0,0,0,.35)}
#lock .logo{margin:0 auto 12px;width:56px;height:56px;font-size:20px}
#lock h1{font-size:20px;margin:0 0 4px;color:var(--navy)}
#lock p{margin:0 0 6px;color:var(--mut);font-size:14px}
#lock input{text-align:center;letter-spacing:6px;font-size:18px}
.ctl{background:#fff;border:1px solid var(--line);border-radius:14px;padding:14px 16px;display:flex;gap:10px;align-items:flex-end;flex-wrap:wrap;box-shadow:0 4px 14px rgba(15,39,66,.07)}
.ctl label{margin:0 0 4px}.dn{display:flex;gap:6px}.dn input{width:auto}.ctl .btn{padding:10px 16px}.ctl .btn.pri{flex:none}
.sp{flex:1}
#rmsg{color:var(--bad);font-size:13px;min-height:18px;margin:8px 2px 0}
.stage{overflow-x:auto;padding:12px 0 30px}
.holder{width:820px;margin:0 auto;box-shadow:0 10px 40px rgba(15,39,66,.18)}
#rep th,#rep td,#sumrep th,#sumrep td{white-space:normal}
@media(max-width:720px){.cols{grid-template-columns:1fr;gap:6px}.stats{grid-template-columns:1fr}.stat b{font-size:22px}}
/* ===== REPORT ===== */
#rep,#sumrep{width:820px;background:#fff;color:#1c2733;font:13px/1.5 Inter,"Hind Siliguri",sans-serif;position:relative}
.rh{background:linear-gradient(120deg,#0b1e34,#1b3f66);color:#fff;padding:28px 34px 26px;position:relative;overflow:hidden;border-bottom:5px solid #c8a24a}
.rh .c1{position:absolute;right:-60px;top:-80px;width:240px;height:240px;border-radius:50%;background:rgba(200,162,74,.14)}
.rh .c2{position:absolute;right:120px;bottom:-110px;width:200px;height:200px;border-radius:50%;background:rgba(255,255,255,.05)}
.rh .row{position:relative;display:flex;justify-content:space-between;align-items:center}
.br{display:flex;align-items:center;gap:14px}
.br .lg{width:54px;height:54px;border-radius:50%;background:#c8a24a;color:#0f2742;font-weight:800;font-size:20px;display:flex;align-items:center;justify-content:center;border:3px solid rgba(255,255,255,.35)}
.br h1{margin:0;font-size:24px;font-weight:800;letter-spacing:.3px}
.br p{margin:0;color:#c8a24a;font-size:12px;letter-spacing:2px;text-transform:uppercase;font-weight:600}
.dt{text-align:right}.dt small{display:block;color:#a9bcd3;font-size:10.5px;letter-spacing:1.5px;text-transform:uppercase}
.dt b{display:block;font-size:19px;font-weight:700}.dt span{font-size:11.5px;color:#a9bcd3}
.rb{padding:22px 34px 6px}
.hero{display:flex;align-items:center;gap:16px;border-radius:14px;padding:16px 20px;border:1.5px solid}
.hero.ok{background:#e6f5ec;border-color:#16803c;color:#16803c}
.hero.bad{background:#fdeceb;border-color:#b42318;color:#b42318}
.hero .ic{width:48px;height:48px;border-radius:50%;color:#fff;font-size:22px;font-weight:800;display:flex;align-items:center;justify-content:center;flex:none}
.hero.ok .ic{background:#16803c}.hero.bad .ic{background:#b42318}
.hero .tx{flex:1}.hero small{display:block;font-size:11px;letter-spacing:1.2px;text-transform:uppercase;font-weight:700;opacity:.85}
.hero .tx b{display:block;font-size:24px;font-weight:800;line-height:1.2}
.hero .tx span{font-size:12px;color:#475569}
.hero .mini{text-align:right;color:#1c2733;font-size:12px;line-height:1.7}.hero .mini b{font-variant-numeric:tabular-nums}
.kp{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-top:14px}
.k{border:1px solid #e2e8f0;border-radius:12px;padding:13px 14px 13px 18px;background:linear-gradient(180deg,#fff,#f4f7fb);position:relative;overflow:hidden}
.k:before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--c,#0f2742)}
.k small{display:block;color:#64748b;font-size:11px;font-weight:600}
.k b{display:block;font-size:18px;font-weight:800;margin-top:3px;font-variant-numeric:tabular-nums}
.two{display:grid;grid-template-columns:1.15fr .85fr;gap:18px;margin-top:20px}
.sec{margin-top:22px}.two .sec{margin-top:0}
.h{display:flex;align-items:center;gap:8px;margin:0 0 10px;padding-bottom:7px;border-bottom:1px solid #e2e8f0;font-size:12px;font-weight:800;color:#0f2742;text-transform:uppercase;letter-spacing:1px}
.h i{width:5px;height:16px;background:#c8a24a;border-radius:3px;display:block}
.h em{margin-left:auto;font-style:normal;text-transform:none;letter-spacing:0;color:#1f7a6d;font-weight:700;font-size:13px}
.lgt{width:100%;border-collapse:collapse;border:1px solid #e2e8f0;border-radius:10px;overflow:hidden}
.lgt td{padding:7px 12px;border-bottom:1px solid #eef2f6;font-size:12.5px}.lgt td:last-child{text-align:right;font-variant-numeric:tabular-nums;font-weight:600}
.lgt tr.tot td{background:#f1f5f9;font-weight:700}.lgt .neg td:last-child{color:#b42318}
.lgt tr.fin td{background:#0f2742;color:#fff;font-weight:800;font-size:14px;border:0}
.rec .row{display:flex;justify-content:space-between;padding:10px 14px;border-radius:10px;background:#f1f5f9;margin-bottom:8px;font-weight:600}
.rec .row b{font-variant-numeric:tabular-nums;color:#0f2742}
.rec .row.d{background:#fff;border:1.5px dashed}.rec .row.d.ok{color:#16803c;border-color:#16803c}.rec .row.d.bad{color:#b42318;border-color:#b42318}.rec .row.d b{color:inherit}
.bar{display:flex;height:16px;border-radius:8px;overflow:hidden;background:#e2e8f0}
.bar div{height:100%}
.legend{display:flex;flex-wrap:wrap;gap:4px 14px;margin-top:6px;font-size:11.5px;color:#475569}
.legend span:before{content:"";display:inline-block;width:9px;height:9px;border-radius:2px;background:var(--c);margin-right:5px}
.t{width:100%;border-collapse:collapse;font-size:12.5px;border:1px solid #e2e8f0}
.t th{background:#0f2742;color:#fff;font-weight:600;text-align:left;padding:8px 10px;font-size:11.5px}
.t td{padding:7px 10px;border-bottom:1px solid #eef2f6;vertical-align:top}
.t tr:nth-child(even) td{background:#f8fafc}
.t .r{text-align:right;font-variant-numeric:tabular-nums}.t .m{color:#64748b}.t .x{color:#94a3b8;width:28px}
.t tfoot td{background:#f3e9cf!important;color:#0f2742;font-weight:800;border-bottom:0}
.empty{padding:12px;color:#94a3b8;font-style:italic;border:1px dashed #cbd5e1;border-radius:10px;text-align:center}
.sig{display:flex;justify-content:space-between;padding:34px 34px 0}
.sig div{width:180px;border-top:1px solid #94a3b8;text-align:center;padding-top:5px;color:#64748b;font-size:11.5px}
.rf{margin-top:22px;background:#0f2742;color:#a9bcd3;padding:12px 34px;display:flex;justify-content:space-between;font-size:11.5px;border-top:4px solid #c8a24a}
.rf b{color:#c8a24a}
.hint{font-size:12.5px;color:#5b4a14;background:#fff8e1;border:1px solid #f0dca0;border-radius:10px;padding:8px 12px;margin-top:8px}
.ed{display:inline-block;min-width:16px;border-radius:3px;outline:none;cursor:text}
.ed:hover{background:#fff6dc;box-shadow:0 0 0 1px #c8a24a}
.ed:focus{background:#fff;color:#1c2733;box-shadow:0 0 0 2px #1f7a6d}
.rh .ed:hover{background:rgba(255,255,255,.14)}.rh .ed:focus{background:rgba(255,255,255,.22);color:#fff;box-shadow:0 0 0 2px #c8a24a}
.del{border:0;background:#fde8e6;color:#b42318;border-radius:6px;cursor:pointer;width:22px;height:22px;font-size:11px}
.add{margin-top:8px;border:1.5px dashed #c8a24a;background:#fffaf0;color:#0f2742;border-radius:8px;padding:6px 12px;font:inherit;font-size:12px;font-weight:600;cursor:pointer}
.t td.dl,.t th.dl{width:30px;text-align:center}
.nb{display:block;min-height:48px;padding:10px 12px;border:1px solid #e2e8f0;border-radius:10px;background:#fafbfc;white-space:pre-wrap}
.nb:empty:before{content:attr(data-ph);color:#94a3b8}
.exp .noexp{display:none!important}
.exp .ed{box-shadow:none!important;background:none!important}

.sumhold{position:fixed;left:-12000px;top:0;pointer-events:none}
input.lk{background:#f3f5f8;color:var(--mut);pointer-events:none}
.dtog{display:block;margin-top:6px;background:none;border:0;color:var(--navy);font:inherit;font-size:12.5px;font-weight:600;cursor:pointer;text-decoration:underline;padding:0}
</style>
</head>

<div class="top"><div class="in">

</div>

<div class="sumhold"><div id="sumrep"></div></div>

function cashCalc(){
  if(!$('s_hand'))return;
  let hand=0;
  NOTES.forEach(v=>{const x=v*nv('q_'+v);hand+=x;$('t_'+v).textContent=x.toLocaleString(lang==='bn'?'bn-BD':'en-IN')});
  const tot=nv('f_prev')+nv('f_ibos')+nv('f_recov')+nv('f_cashin');
  const led=tot-nv('f_expense')-nv('f_cashout')-nv('f_cod');
  const diff=hand-led;
  $('s_hand').textContent=$('s_hand2').textContent=fmt(hand);
  $('s_led').textContent=$('s_led2').textContent=fmt(led);
  $('s_tot').textContent=fmt(tot);
  $('s_box').className='stat '+(diff>=0?'ok':'bad');
  $('s_lab').textContent=diff===0?t('match'):diff>0?t('over'):t('short');
  $('s_diff').textContent=fmt(Math.abs(diff));
}

function normDate(x){
  const s=String(x).trim();let m=s.match(/^(\d{4})-(\d{2})-(\d{2})/);if(m)return m[1]+'-'+m[2]+'-'+m[3];
  const d=new Date(s);if(!isNaN(d))return new Date(d-d.getTimezoneOffset()*6e4).toISOString().slice(0,10);
  m=s.match(/^(\d{1,2})[\/\-](\d{1,2})[\/\-](\d{4})/);if(m)return m[3]+'-'+m[2].padStart(2,'0')+'-'+m[1].padStart(2,'0');
  return s;
}
const pick=(head,n)=>head.indexOf(n);
function rowsFor(res,date){const di=Math.max(0,pick(res.head,'Date'));return res.rows.filter(r=>normDate(r[di])===date)}

function table(key,cols){
  const {head,rows}=DATA[key];
  const idx=cols.map(c=>pick(head,c.h));let sum=0;
  const body=rows.map((r,n)=>'<tr><td class="x">'+(n+1)+'</td>'+cols.map((c,j)=>{
    const i=idx[j],v=i<0?'':r[i];if(c.amt)sum+=num(v);
    const s=c.amt?money(v):String(v==null?'':v);
    const inner=i<0?esc(s):'<span '+edAttr(key+'-'+n+'-'+i,'data-k="'+key+'" data-r="'+n+'" data-c="'+i+'"'+(c.amt?' data-a="1"':''),s)+'>'+esc(s)+'</span>';
    return '<td'+(c.amt?' class="r"':c.mut?' class="m"':'')+'>'+inner+'</td>'}).join('')+'<td class="dl noexp"><button class="del" data-del="'+key+'" data-r="'+n+'">✕</button></td></tr>').join('');
  const foot='<tfoot><tr><td></td>'+cols.map((c,j)=>j===0?'<td>'+t('tot')+' ('+rows.length+')</td>':c.amt?'<td class="r">'+money(sum)+'</td>':'<td></td>').join('')+'<td class="noexp"></td></tr></tfoot>';
  const tbl=rows.length?'<table class="t"><thead><tr><th>#</th>'+cols.map(c=>'<th'+(c.amt?' class="r"':'')+'>'+t(c.k)+'</th>').join('')+'<th class="dl noexp"></th></tr></thead><tbody>'+body+'</tbody>'+foot+'</table>':'<div class="empty">'+t('rnone')+'</div>';

function sumOf(key,h,type){
  const {head,rows}=DATA[key],i=pick(head,h),ti=pick(head,'Type');

  const recTot=sumOf('recovery','Amount'),bakiTot=sumOf('baki','Amount');
  const now=new Date().toLocaleString(loc(),{dateStyle:'medium',timeStyle:'short'});
  const hero='<div class="hero '+(good?'ok':'bad')+'"><div class="ic">'+(diff===0?'✓':diff>0?'▲':'▼')+'</div><div class="tx"><small>'+(diff===0?t('sOk'):diff>0?t('sOver'):t('sShort'))+'</small><b>'+(diff===0?money(hand):money(Math.abs(diff)))+'</b><span>'+(diff===0?t('mOk'):diff>0?t('mOver'):t('mShort'))+'</span></div>'+
    '<div class="mini">'+t('hand')+': <b>'+money(hand)+'</b><br>'+t('led')+': <b>'+money(led)+'</b></div></div>';
  const L=(a,k,c)=>'<tr'+(c?' class="'+c+'"':'')+'><td>'+a+'</td><td>'+dv(k)+'</td></tr>';
  const LR=(a,v,c)=>'<tr class="'+c+'"><td>'+a+'</td><td>'+money(v)+'</td></tr>';
  const ledger='<table class="lgt">'+L(t('prev'),'prev')+L('(+) '+t('sale'),'sale')+L('(+) '+t('rec'),'rec')+L('(+) '+t('cin'),'cin')+LR(t('total'),tot,'tot')+L('(−) '+t('exp'),'exp','neg')+L('(−) '+t('rcout'),'cout','neg')+L('(−) '+t('cod'),'cod','neg')+LR(t('led'),led,'fin')+'</table>';
  const recon='<div class="rec"><div class="row"><span>'+t('hand')+'</span><b>'+dv('hand')+'</b></div><div class="row"><span>'+t('led')+'</span><b>'+money(led)+'</b></div><div class="row d '+(good?'ok':'bad')+'"><span>'+t('diff')+'</span><b>'+(diff>0?'+':diff<0?'−':'')+money(Math.abs(diff))+'</b></div></div>';
  let two='<div class="two">'+sec(t('secLed'),'',ledger)+sec(t('secRec'),'',recon)+'</div>';
  if(tot>0){
    const p=v=>Math.max(0,v/tot*100).toFixed(2)+'%',rem=Math.max(0,led);
    const seg=[[exp,'#b42318',t('exp')],[cout,'#c8a24a',t('rcout')],[cod,'#7c5cbf',t('cod')],[rem,'#1f7a6d',t('remain')]];
    two+=sec(t('flow'),'','<div class="bar">'+seg.map(x=>'<div style="width:'+p(x[0])+';background:'+x[1]+'"></div>').join('')+'</div><div class="legend">'+seg.map(x=>'<span style="--c:'+x[1]+'">'+x[2]+' · '+money(x[0])+'</span>').join('')+'</div>');
  }
  const kp=[[t('kSale'),sale,'#1f7a6d'],[t('kRec'),recTot||rec,'#0f2742'],[t('kExp'),expTot||exp,'#b42318'],[t('kDue'),bakiTot,'#c8a24a']];
  const nv=TXT.notes||'';
  const notes='<span class="ed nb" contenteditable="true" tabindex="0" data-id="t-notes" data-t="notes" data-m="1" data-ph="'+esc(t('notesPh'))+'" data-o="'+esc(nv)+'">'+esc(nv)+'</span>';
  busy=true;
  $('rep').innerHTML=
   '<div class="rh"><div class="c1"></div><div class="c2"></div><div class="row"><div class="br"><div class="lg">LF</div><div><h1>'+tx('brand','Liz Fashion – AponBazaar')+'</h1><p>'+tx('rpt',t('rpt'))+'</p></div></div>'+
   '<div class="dt"><small>'+t('dateL')+'</small><b>'+esc(dateTxt)+'</b><span>'+t('no')+' DR-'+DATE.replace(/-/g,'')+'</span></div></div></div>'+
   '<div class="rb">'+hero+
   '<div class="kp">'+kp.map(k=>'<div class="k" style="--c:'+k[2]+'"><small>'+k[0]+'</small><b>'+money(k[1])+'</b></div>').join('')+'</div>'+
   two+
   sec(t('sExp'),money(expTot),table('expense',[{h:'Expense Name',k:'c_name'},{h:'Note',k:'c_note',mut:1},{h:'Expense Code',k:'c_code'},{h:'Status',k:'c_status'},{h:'Amount',k:'c_amt',amt:1}]))+
   sec(t('sCash'),'+'+money(cashIn)+'  /  −'+money(cashOut),table('cash',[{h:'Type',k:'c_type'},{h:'Note',k:'c_note',mut:1},{h:'Amount',k:'c_amt',amt:1}]))+
   sec(t('sRec'),money(recTot),table('recovery',[{h:'Customer ID',k:'c_id'},{h:'Customer Name',k:'c_cust'},{h:'Amount',k:'c_amt',amt:1},{h:'Exchange With Cash',k:'c_exch'},{h:'Remarks',k:'c_rem',mut:1}]))+
   sec(t('sBaki'),money(bakiTot),table('baki',[{h:'Name',k:'c_cust'},{h:'Reason',k:'c_reason',mut:1},{h:'Amount',k:'c_amt',amt:1}]))+
   sec(t('notes'),'',notes,'nsec')+
   '</div><div class="sig"><div>'+tx('s1',t('s1'))+'</div><div>'+tx('s2',t('s2'))+'</div></div>'+
   '<div class="rf"><span><b>Liz Fashion</b> – AponBazaar</span><span>'+t('gen')+': '+esc(now)+'</span></div>';
  busy=false;
  fit();
}
function commit(el){
  if(!el||!el.classList||!el.classList.contains('ed'))return false;
  const d=el.dataset,v=el.innerText.replace(/\u00a0/g,' ').trim();
  if(v===d.o)return false;
  if(d.d)D[d.d]=num(v);
  else if(d.t)TXT[d.t]=v;
  else DATA[d.k].rows[+d.r][+d.c]=d.a?num(v):v;
  return true;
}
const R=$('rep');
R.addEventListener('focusout',e=>{
  if(busy||!commit(e.target))return;
  const nx=e.relatedTarget&&e.relatedTarget.dataset?e.relatedTarget.dataset.id:null;
  render();
  if(nx){const n=R.querySelector('[data-id="'+nx+'"]');if(n)n.focus()}
});
R.addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.classList.contains('ed')&&!e.target.dataset.m){e.preventDefault();e.target.blur()}});
R.addEventListener('paste',e=>{if(e.target.classList.contains('ed')){e.preventDefault();document.execCommand('insertText',false,(e.clipboardData||window.clipboardData).getData('text'))}});
R.addEventListener('mousedown',e=>{if(e.target.closest('button'))e.preventDefault()});
R.addEventListener('click',e=>{
  const b=e.target.closest('button');if(!b)return;
  commit(document.activeElement);
  if(b.dataset.del)DATA[b.dataset.del].rows.splice(+b.dataset.r,1);
  else if(b.dataset.add)addRow(b.dataset.add);
  render();
});
function fit(){
  const h=$('holder'),w=Math.min(1,(window.innerWidth-34)/820);
  h.style.zoom=w<1?w:'';
}
window.addEventListener('resize',()=>{if(DATA)fit()});

async function download(){
  if(document.activeElement)document.activeElement.blur();const h=$('holder'),z=h.style.zoom,rp=$('rep'),ns=$('nsec'),hn=ns&&!TXT.notes;h.style.zoom='';$('dl').disabled=true;rp.classList.add('exp');if(hn)ns.style.display='none';
  try{
    if(document.fonts&&document.fonts.ready)await document.fonts.ready;
    const c=await html2canvas($('rep'),{scale:2.5,backgroundColor:'#ffffff',useCORS:true,windowWidth:820});
    const a=document.createElement('a');a.href=c.toDataURL('image/jpeg',0.96);a.download='Liz-Fashion-Report-'+DATE+'.jpg';
    document.body.appendChild(a);a.click();a.remove();
  }catch(e){$('rmsg').textContent=String(e.message||e)}
  h.style.zoom=z;$('dl').disabled=false;rp.classList.remove('exp');if(hn)ns.style.display='';
}

function shift(n){const d=new Date($('d').value+'T00:00:00');d.setDate(d.getDate()+n);$('d').value=new Date(d-d.getTimezoneOffset()*6e4).toISOString().slice(0,10);build()}
$('pv').onclick=()=>shift(-1);$('nx').onclick=()=>shift(1);$('td').onclick=()=>{$('d').value=today();build()};
$('load').onclick=build;$('d').onchange=build;$('dl').onclick=download;
function sumHTML(x){
  const tot=x.prev+x.sale+x.rec+x.cin,led=tot-x.exp-x.cout-x.cod,hand=x.hand,diff=hand-led,good=diff>=0;
  const dateTxt=new Date(x.date+'T00:00:00').toLocaleDateString(loc(),{weekday:'long',day:'numeric',month:'long',year:'numeric'});
  const now=new Date().toLocaleString(loc(),{dateStyle:'medium',timeStyle:'short'});
  const hero='<div class="hero '+(good?'ok':'bad')+'"><div class="ic">'+(diff===0?'✓':diff>0?'▲':'▼')+'</div><div class="tx"><small>'+(diff===0?t('sOk'):diff>0?t('sOver'):t('sShort'))+'</small><b>'+(diff===0?money(hand):money(Math.abs(diff)))+'</b><span>'+(diff===0?t('mOk'):diff>0?t('mOver'):t('mShort'))+'</span></div><div class="mini">'+t('hand')+': <b>'+money(hand)+'</b><br>'+t('led')+': <b>'+money(led)+'</b></div></div>';
  const L=(a,v,c)=>'<tr'+(c?' class="'+c+'"':'')+'><td>'+a+'</td><td>'+money(v)+'</td></tr>';
  const ledger='<table class="lgt">'+L(t('prev'),x.prev)+L('(+) '+t('sale'),x.sale)+L('(+) '+t('rec'),x.rec)+L('(+) '+t('cin'),x.cin)+L(t('total'),tot,'tot')+L('(−) '+t('exp'),x.exp,'neg')+L('(−) '+t('rcout'),x.cout,'neg')+L('(−) '+t('cod'),x.cod,'neg')+L(t('led'),led,'fin')+'</table>';
  const recon='<div class="rec"><div class="row"><span>'+t('hand')+'</span><b>'+money(hand)+'</b></div><div class="row"><span>'+t('led')+'</span><b>'+money(led)+'</b></div><div class="row d '+(good?'ok':'bad')+'"><span>'+t('diff')+'</span><b>'+(diff>0?'+':diff<0?'−':'')+money(Math.abs(diff))+'</b></div></div>';
  let flow='<div class="empty">—</div>';
  if(tot>0){
    const p=v=>Math.max(0,v/tot*100).toFixed(2)+'%';
    const seg=[[x.exp,'#b42318',t('exp')],[x.cout,'#c8a24a',t('rcout')],[x.cod,'#7c5cbf',t('cod')],[Math.max(0,led),'#1f7a6d',t('remain')]];
    flow='<div class="bar">'+seg.map(g=>'<div style="width:'+p(g[0])+';background:'+g[1]+'"></div>').join('')+'</div><div class="legend">'+seg.map(g=>'<span style="--c:'+g[1]+'">'+g[2]+' · '+money(g[0])+'</span>').join('')+'</div>';
  }
  let mid=sec(t('flow'),'',flow);
  if(x.notes){
    let pcs=0;
    const rows=NOTES.map(v=>{const q=x.notes[v]||0;pcs+=q;return '<tr'+(q?'':' style="color:#94a3b8"')+'><td>৳ '+v+'</td><td class="r">'+q.toLocaleString(loc())+'</td><td class="r">'+money(v*q)+'</td></tr>'}).join('');
    const nt='<table class="t"><thead><tr><th>'+t('noteCol')+'</th><th class="r">'+t('qty')+'</th><th class="r">'+t('total')+'</th></tr></thead><tbody>'+rows+'</tbody><tfoot><tr><td>'+t('handsum')+'</td><td class="r">'+pcs.toLocaleString(loc())+'</td><td class="r">'+money(hand)+'</td></tr></tfoot></table>';
    mid='<div class="two">'+sec(t('secN'),'',nt)+sec(t('flow'),'',flow)+'</div>';
  }
  return '<div class="rh"><div class="c1"></div><div class="c2"></div><div class="row"><div class="br"><div class="lg">LF</div><div><h1>Liz Fashion – AponBazaar</h1><p>'+t('sumRpt')+'</p></div></div><div class="dt"><small>'+t('dateL')+'</small><b>'+esc(dateTxt)+'</b><span>'+t('no')+' CS-'+x.date.replace(/-/g,'')+'</span></div></div></div>'+
   '<div class="rb">'+hero+'<div class="two">'+sec(t('secLed'),'',ledger)+sec(t('secRec'),'',recon)+'</div>'+(x.notes?mid:sec(t('flow'),'',flow))+'</div>'+
   '<div class="sig"><div>'+t('s1')+'</div><div>'+t('s2')+'</div></div><div class="rf"><span><b>Liz Fashion</b> – AponBazaar</span><span>'+t('gen')+': '+esc(now)+'</span></div>';
}
async function saveSummary(x,btn){
  const out=cur==='report'?$('rmsg'):$('msg');
  if(!x.date){if(cur==='report')out.textContent=t('needdate');else say(t('needdate'),1);return}
  btn.disabled=true;
  try{
    const h=$('sumrep');h.innerHTML=sumHTML(x);
    if(document.fonts&&document.fonts.ready)await document.fonts.ready;
    const c=await html2canvas(h,{scale:2.5,backgroundColor:'#ffffff',useCORS:true,windowWidth:820});
    const a=document.createElement('a');a.href=c.toDataURL('image/jpeg',0.96);a.download='Liz-Fashion-Summary-'+x.date+'.jpg';
    document.body.appendChild(a);a.click();a.remove();
  }catch(e){if(cur==='report')out.textContent=String(e.message||e);else say(String(e.message||e),1)}
  btn.disabled=false;
}
$('sumjpg').onclick=()=>{
  const fd=$('f_date');if(fd&&fd.readOnly)fd.value=today();
  let hand=0;const notes={};NOTES.forEach(v=>{notes[v]=nv('q_'+v);hand+=v*notes[v]});
  saveSummary({date:$('f_date').value,prev:nv('f_prev'),sale:nv('f_ibos'),rec:nv('f_recov'),cin:nv('f_cashin'),exp:nv('f_expense'),cout:nv('f_cashout'),cod:nv('f_cod'),hand,notes},$('sumjpg'));
};
$('sumr').onclick=()=>saveSummary({date:DATE,...D,notes:null},$('sumr'));
document.addEventListener('visibilitychange',()=>{const d=$('f_date');if(d&&d.readOnly)d.value=today()});
applyLang();
</script>
